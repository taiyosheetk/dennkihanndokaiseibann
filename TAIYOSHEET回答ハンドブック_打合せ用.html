 const f=el("div","form");f.innerHTML='<label>案件名（○○地方整備局＋○○号線＋○○工事）</label><input id="p_name" placeholder="例：○○地方整備局 国道○号 ○○工事"><div class="grid2"><div><label>道路管理者</label><input id="p_owner" placeholder="例：○○河川国道事務所"></div><div><label>路線・箇所</label><input id="p_route" placeholder="例：国道○号 ○○橋付近"></div></div><div class="grid2"><div><label>道路延長［m］</label><input id="p_len" type="number" inputmode="decimal" placeholder="例：150"></div><div><label>対象車線</label><select id="p_lanes"><option value="1">片側1車線（2条）</option><option value="2">両方向（4条）</option></select></div></div><div class="grid2"><div><label>表層の種類</label><input id="p_surface" placeholder="例：密粒度／排水性"></div><div><label>既設電源・盤</label><input id="p_existing" placeholder="例：既設分電盤あり／なし"></div></div><div class="grid2"><div><label>気温設定［℃］（0〜6）</label><input id="p_tair" type="number" inputmode="decimal" placeholder="例：3"></div><div><label>ヒーター温度設定［℃］（35〜60）</label><input id="p_theat" type="number" inputmode="decimal" placeholder="例：35"></div></div><label>受電方式（協議結果）</label><input id="p_power" placeholder="例：低圧・既設盤から／高圧・キュービクル新設"><label>舗装復旧基準・協議メモ</label><textarea id="p_note" placeholder="例：幅20mm切削で復旧承認済（○月○日協議）"></textarea><div class="grid2"><div><label>担当・連絡先</label><input id="p_person" placeholder="例：計画推進部 内線○○"></div><div><label>更新日</label><input id="p_date" placeholder="例：2026-10-03"></div></div><div class="calc" id="p_calc"></div><div class="btnrow"><button class="pri" id="p_copy">控えをコピー</button><button id="p_load">貼り付けて読み込み</button><button class="warn" id="p_clear">クリア</button></div><textarea id="p_paste" style="display:none;margin-top:10px" placeholder="控えのJSON、または現地調査アプリの出力JSONを貼り付けて、もう一度「貼り付けて読み込み」"></textarea>';m.appendChild(f);
 setTimeout(()=>{const map={name:"p_name",owner:"p_owner",route:"p_route",len:"p_len",lanes:"p_lanes",surface:"p_surface",existing:"p_existing",tair:"p_tair",theat:"p_theat",power:"p_power",note:"p_note",person:"p_person",date:"p_date"};
  const upd=()=>{const c=calc();const e=document.getElementById("p_calc");if(e)e.innerHTML=c.ext?('<b>自動試算</b>　施工延長 '+c.ext+'m（'+c.cond+'条）／本数 '+c.units+'本／容量 <b>'+c.kw+'kW</b>／電流 '+c.amps.toFixed(1)+'A／受電方式 <b>'+c.mode+'</b>／発熱体工事 目安 '+c.days+'日'+(c.kw>=40&&c.kw<50?'<br><span style="color:#B8962E;font-weight:800">50kWに近いため、延伸の予定があれば高圧受電も比較検討</span>':'')):'道路延長を入れると本数・容量・受電方式を試算します。';};
  Object.entries(map).forEach(([k,id])=>{const e=document.getElementById(id);if(!e)return;e.value=PROJ[k];e.addEventListener("input",()=>{PROJ[k]=e.value;upd();});});upd();
  document.getElementById("p_copy").onclick=()=>{const b=document.getElementById("p_copy");(navigator.clipboard?navigator.clipboard.writeText(JSON.stringify(PROJ)):Promise.reject()).then(()=>{b.textContent="コピーしました";setTimeout(()=>b.textContent="控えをコピー",1500);}).catch(()=>{b.textContent="コピーできません";});};
  document.getElementById("p_load").onclick=()=>{const ta=document.getElementById("p_paste");if(ta.style.display==="none"){ta.style.display="block";ta.focus();return;}try{importProj(JSON.parse(ta.value));render();}catch(e){ta.value="";ta.placeholder="読み込めませんでした。JSONの形式を確認してください。";}};
  document.getElementById("p_clear").onclick=()=>{Object.keys(PROJ).forEach(k=>PROJ[k]=k==="lanes"?"1":"");render();};},0);
 return m;}

let pendingMemo="";
function viewMemo(){setTop("質問メモ","答えられなかった質問を記録","more");const m=el("main");m.appendChild(el("div","note",'<span class="lb">使い方</span>その場で記録し、「メールで送る」で計画推進部宛の下書きを作ります（宛先は送信時に入力）。<b>メモはアプリを閉じると消える</b>ため、その日のうちに送信またはコピーしてください。'));
 const f=el("div","form");f.innerHTML='<h3>質問をメモ</h3><label>質問の内容（先方の言い方のまま）</label><textarea id="m_q"></textarea><div class="grid2"><div><label>誰から</label><input id="m_who" placeholder="例：○○事務所 ○○係長"></div><div><label>何を判断するために</label><input id="m_why" placeholder="例：予算化の可否"></div></div><div class="grid2"><div><label>いつまでに</label><input id="m_when"></div><div><label>求められている粒度</label><input id="m_gran" placeholder="例：概略／数値根拠"></div></div><div class="btnrow"><button class="pri" id="m_add">メモに追加</button></div>';m.appendChild(f);
 setTimeout(()=>{const q=document.getElementById("m_q");if(pendingMemo){q.value=pendingMemo;pendingMemo="";}document.getElementById("m_add").onclick=()=>{const v=q.value.trim();if(!v)return;MEMOS.unshift({q:v,who:document.getElementById("m_who").value,why:document.getElementById("m_why").value,when:document.getElementById("m_when").value,gran:document.getElementById("m_gran").value,proj:PROJ.name,d:new Date().toLocaleString("ja-JP")});render();};},0);
 m.appendChild(el("div","sect","メモ一覧　"+MEMOS.length+"件"));if(!MEMOS.length)m.appendChild(el("div","empty",'<p>メモはまだありません</p>'));
 MEMOS.forEach((x,i)=>{const c=el("div","memo",'<div class="mq">'+esc(x.q)+'</div><div class="mm">'+[x.who&&"相手："+x.who,x.why&&"目的："+x.why,x.when&&"期限："+x.when,x.gran&&"粒度："+x.gran,x.proj&&"案件："+x.proj].filter(Boolean).map(esc).join("　／　")+'</div><div class="md"><span>'+esc(x.d)+'</span><button>削除</button></div>');c.querySelector("button").onclick=()=>{MEMOS.splice(i,1);render();};m.appendChild(c);});
 if(MEMOS.length){const text=()=>"【回答ハンドブック 質問メモ】\n"+MEMOS.map((x,i)=>(i+1)+". "+x.q+"\n   相手："+(x.who||"-")+"／目的："+(x.why||"-")+"／期限："+(x.when||"-")+"／粒度："+(x.gran||"-")+"／案件："+(x.proj||"-")+"／記録："+x.d).join("\n\n")+"\n\n※ Q&Aへの追加・回答案の作成をお願いします。";const br=el("div","btnrow");const ml=el("button","pri","メールで送る（下書き）");ml.onclick=()=>{location.href="mailto:?subject="+encodeURIComponent("【回答ハンドブック】質問メモ "+MEMOS.length+"件")+"&body="+encodeURIComponent(text());};const cp=el("button","","全部コピー");cp.onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(text()):Promise.reject()).then(()=>{cp.textContent="コピーしました";setTimeout(()=>cp.textContent="全部コピー",1500);}).catch(()=>{cp.textContent="コピーできません";});};br.appendChild(ml);br.appendChild(cp);m.appendChild(br);}
 return m;}

function viewDocs(a){const m=el("main");
 if(a===undefined||a===""){setTop("資料","詳細の解説版・原資料 "+DOCS.length+"件",null);
  m.appendChild(el("div","note",'<span class="lb">位置づけ</span>Q&Aの根拠となった詳細の解説資料です。Q&Aで足りないとき、先方に資料そのものを示したいときに開きます。回答画面の「出典を開く」からは該当箇所へ直接飛びます。数値は概要説明用で、契約・性能保証・提出図書には設計図書・メーカー仕様書・管理者協議で確定した値を使います。'));
  DOCS.forEach((d,i)=>{const tmp=document.createElement("div");tmp.innerHTML=d.html;const nh=tmp.querySelectorAll("h1,h2,h3").length,ni=tmp.querySelectorAll("img").length,nt=tmp.querySelectorAll("table").length;
   const t=el("button","tile",'<div class="ti"><span class="ic">資</span><div><div class="tt">'+esc(d.title)+'</div><div class="ts">'+[nh?nh+"節":"",ni?"図"+ni+"点":"",nt?"表"+nt:""].filter(Boolean).join("・")+'</div></div><span class="ar">›</span></div>');t.onclick=()=>go("docs/"+i);m.appendChild(t);});
  m.appendChild(el("div","foot","各資料の原本（Word）は計画推進部で管理しています。"));return m;}
 const di=parseInt(a);const d=DOCS[di];if(!d){go("docs");return m;}
 setTop(d.title,"補足資料 "+(di+1)+" / "+DOCS.length,"docs");
 const c=el("div","doc open");const body=el("div","dc");body.innerHTML=d.html;c.appendChild(body);m.appendChild(c);
 const pn=el("div","pn");const bp=el("button","",di>0?"← 前の資料":"← 資料一覧");bp.onclick=()=>go(di>0?"docs/"+(di-1):"docs");const bn=el("button","pri",di<DOCS.length-1?"次の資料 →":"資料一覧へ");bn.onclick=()=>go(di<DOCS.length-1?"docs/"+(di+1):"docs");pn.appendChild(bp);pn.appendChild(bn);m.appendChild(pn);document.body.classList.add("haspn");
 if(pendingDoc&&pendingDoc.di===di){const {h}=pendingDoc;pendingDoc=null;setTimeout(()=>{let target=null;if(h){target=[...body.querySelectorAll("h1,h2,h3")].find(x=>x.textContent.trim().startsWith(h)||x.textContent.includes(h));if(target)target.setAttribute("data-hit","1");}if(target)target.scrollIntoView({behavior:"smooth",block:"start"});},80);}
 return m;}
function viewMore(){setTop("その他","メモ・資料・用語・設定",null);const m=el("main");
 [["memo","✎","質問メモ","答えられなかった質問"+(MEMOS.length?"（"+MEMOS.length+"）":"")],["docs","資","資料（詳細解説）","原資料の全文・図・表（"+DOCS.length+"件）"],["terms","語","用語集","轍部・自家用電気工作物・デマンド…"],["fall","！","答えに困ったら","持ち帰りの言い方・言ってはいけない表現"],["nums","#","数字の早見・根拠バッジ","160W/m・8kW・50kW…"]].forEach(([k,ic,tt,ts])=>{const b=el("button","tile",'<div class="ti"><span class="ic">'+ic+'</span><div><div class="tt">'+tt+'</div><div class="ts">'+ts+'</div></div><span class="ar">›</span></div>');b.onclick=()=>go(k);m.appendChild(b);});
 const s=el("button","tile",'<div class="ti"><span class="ic">Aあ</span><div><div class="tt">文字の大きさを変える</div><div class="ts">3段階で切替</div></div></div>');s.onclick=()=>document.getElementById("fs").onclick();m.appendChild(s);
 m.appendChild(el("div","foot","<b>注意</b>　数値は概要説明用です。契約・性能保証・提出図書には、案件ごとの設計図書・メーカー仕様書・管理者協議で確定した値を使用してください。<br>質問の追加・誤りの指摘はTAIYOSHEET計画推進部へ。<br>2026-10-03版（v5）"));return m;}
function viewTerms(){setTop("用語集",QA.filter(x=>x.c==="term").length+"語","more");const m=el("main");QA.filter(x=>x.c==="term").forEach(x=>m.appendChild(qrow(x)));return m;}
function viewFall(){setTop("答えに困ったら","持ち帰りの言い方とNG表現","more");const m=el("main");
 m.appendChild(el("div","note red",'<span class="lb">まずこの一言</span><b>「その点は正確にお答えしたいので、確認して折り返します。」</b>　憶測で答えるより信頼を損ねません。持ち帰るときは、誰が・何を判断するために・いつまでに、をメモに。'));
 QA.filter(x=>x.c==="fall").forEach(x=>m.appendChild(qrow(x)));
 const b=el("div","ng");b.innerHTML='<div class="sect" style="margin:4px 0 8px">言ってはいけない表現と、言い換え</div>'+NG.map(([x,o])=>'<div class="r"><div class="x">'+esc(x)+'</div><div class="o">'+esc(o)+'</div></div>').join('');m.appendChild(b);return m;}

function render(){const {root,a,b}=route();document.body.classList.remove("haspn");let m;
 switch(root){case "home":m=viewHome();break;case "search":m=viewSearch();break;case "q":m=viewDetail(parseInt(a));break;case "script":m=viewScript(a,b);break;case "proj":m=viewProj("proj");break;case "prep":m=viewProj("prep");break;case "more":m=viewMore();break;case "memo":m=viewMemo();break;case "docs":m=viewDocs(a);break;case "terms":m=viewTerms();break;case "fall":m=viewFall();break;case "nums":m=viewNums();break;default:m=viewHome();}
 if(!m)return;const old=document.querySelector("main");if(old)old.replaceWith(m);else document.body.insertBefore(m,document.getElementById("nav"));
 const navroot={q:"search",prep:"proj",memo:"more",terms:"more",fall:"more",nums:"more"}[root]||root;[...nav.children].forEach(x=>x.classList.toggle("on",x.dataset.k===navroot));
 if(root!=="search"&&!(root==="q")&&!(root==="docs"&&pendingDoc))window.scrollTo({top:0});}
render();
</script>
