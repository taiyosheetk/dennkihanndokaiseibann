<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="回答ハンドブック">
<meta name="theme-color" content="#16202B">
<title>TAIYOSHEET 回答ハンドブック｜打合せ・面談用</title>
<style>:root{--navy:#16202B;--navy2:#243242;--red:#C8102E;--gold:#B8962E;--gold2:#F6EFD9;--paper:#F4F5F7;--line:#DDE2E8;--sub:#5A6675;--ink:#16202B;--fs:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic Medium","Yu Gothic","Noto Sans JP",system-ui,sans-serif;font-size:var(--fs);line-height:1.75;-webkit-font-smoothing:antialiased;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
/* top bar */
.top{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 1px 6px rgba(0,0,0,.2)}
.top .trow{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:54px}
.top .back{flex:0 0 auto;border:0;background:var(--navy2);color:#fff;border-radius:10px;padding:8px 12px;font:800 13px/1.2 inherit;font-family:inherit}
.top .ttl{flex:1;font-weight:800;font-size:16px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-size:10px;color:#A9B4C1;font-weight:600;letter-spacing:.14em}
.top .act{flex:0 0 auto;border:0;background:var(--navy2);color:#fff;border-radius:10px;padding:8px 11px;font:800 13px/1.2 inherit;font-family:inherit}
main{max-width:820px;margin:0 auto;padding:14px 12px 24px}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 8px rgba(0,0,0,.06)}
.nav button{flex:1;border:0;background:none;padding:9px 1px 7px;min-width:0;font-family:inherit;color:var(--sub);font-size:10.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button i{display:block;width:34px;height:30px;border-radius:9px;font-style:normal;font-size:16px;line-height:30px;text-align:center;background:transparent}
.nav button.on{color:var(--navy)}.nav button.on i{background:var(--gold2);color:var(--navy)}
/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:10px;overflow:hidden}
.tile{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:16px 16px;margin-bottom:10px;font-family:inherit;color:var(--ink);cursor:pointer}
.tile .ti{display:flex;align-items:center;gap:12px}
.tile .ic{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--gold2);color:var(--navy);font-size:20px;display:flex;align-items:center;justify-content:center;border:1px solid #E7D9A8}
.tile .tt{font-size:17px;font-weight:800;line-height:1.3}
.tile .ts{font-size:12.5px;color:var(--sub);font-weight:600;margin-top:2px}
.tile .ar{margin-left:auto;color:#9AA5B1;font-size:16px}
.tile.red .ic{background:#FBE9EC;border-color:#F0C3CA;color:var(--red)}
.tile.navy .ic{background:#E8ECF2;border-color:#C9D2DE;color:var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid .tile{margin:0;padding:14px 13px}
.grid .tile .ti{flex-direction:column;align-items:flex-start;gap:8px}.grid .tile .ar{display:none}
.sect{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--sub);margin:18px 4px 8px}
/* search */
.sbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.sbox{flex:1;position:relative}
.sbox input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px 40px 14px 14px;font-size:16px;font-weight:600;background:#fff;color:var(--ink);outline:none;font-family:inherit;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sbox input:focus{border-color:var(--navy)}
.sbox button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#E3E8EF;color:var(--navy);border:0;border-radius:50%;width:26px;height:26px;font-size:15px;line-height:1;display:none}
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pills button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;font-family:inherit;color:var(--sub)}
.pills button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:8px;cursor:pointer}
.row .q{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.row.term .q{background:var(--navy)}
.row .t{flex:1;font-weight:800;font-size:15.5px;line-height:1.5}
.row .t small{display:block;font-size:11.5px;color:var(--sub);font-weight:600;margin-top:2px}
.row .ar{color:#9AA5B1}
.stat{font-size:12.5px;color:var(--sub);font-weight:700;margin:4px 4px 10px}
/* badges */
.g{display:inline-block;font-size:10px;font-weight:800;padding:1px 7px;border-radius:5px;margin-left:6px;vertical-align:middle;letter-spacing:.04em;white-space:nowrap;border:1px solid transparent}
.g1{background:var(--navy);color:#fff}.g2{background:#fff;color:var(--navy);border-color:var(--navy)}.g3{background:var(--gold);color:#fff}.g4{background:var(--red);color:#fff}.g5{background:#E3E8EF;color:#3C4A5A}.g6{background:#fff;color:var(--red);border-color:var(--red)}
/* detail */
.det{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:18px 16px}
.det .dq{font-size:1.15em;font-weight:800;line-height:1.5}
.det .dq::before{content:"Q　";color:var(--red)}
.det .da{margin-top:14px;background:#FBF9F3;border-left:4px solid var(--red);border-radius:0 8px 8px 0;padding:14px 15px;font-size:1.05em;line-height:1.9}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:800;color:var(--navy);font-family:inherit}
.tools button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.tools button.done{background:var(--gold);border-color:var(--gold);color:#fff}
.fold{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fold .fh{padding:11px 13px;font-size:12.5px;font-weight:800;color:var(--sub);cursor:pointer;background:#F6F8FA;display:flex;justify-content:space-between}
.fold .fb{display:none;padding:12px 13px;font-size:.92em;line-height:1.8;color:#33404E}
.fold.open .fb{display:block}
.src{margin-top:12px;font-size:12.5px;color:var(--sub)}
.src button{border:0;background:none;padding:0;color:var(--navy);font-weight:800;font-family:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer}
.note{background:var(--gold2);border:1px solid #E7D9A8;border-radius:10px;padding:11px 14px;font-size:.9em;line-height:1.75;margin-bottom:10px;color:#33404E}
.note .lb{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--gold);font-weight:800;margin-bottom:4px}
.note.red{background:#FBF4F5;border-color:#F0C3CA}.note.red .lb{color:var(--red)}
.empty{background:#fff;border:1px dashed #C3CCD6;border-radius:12px;padding:24px 16px;text-align:center}
.empty p{margin:0 0 6px;font-weight:800}.empty small{color:var(--sub);font-size:13px;line-height:1.8;display:block}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btnrow button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:800;color:var(--navy);font-family:inherit}
.btnrow button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}.btnrow button.warn{color:var(--red);border-color:#F0C3CA}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.nums button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.nums b{display:block;font-size:18px;font-weight:800;color:var(--red)}.nums span{font-size:11.5px;color:var(--sub);font-weight:600;line-height:1.5;display:block}
mark{background:#F3E4A6;color:inherit;padding:0 1px;border-radius:2px}
/* script */
.scen .tile .ts{color:var(--sub)}
.step{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden}
.step .sh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#F6F8FA;border-bottom:1px solid var(--line)}
.step .sn{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.step .st{flex:1;font-weight:800;font-size:1.05em}.step .sm{font-size:12px;color:var(--sub);font-weight:700}
.step .say{padding:16px 16px 8px;font-size:1.08em;line-height:1.95}
.step .say::before{content:"話すこと";display:block;font-size:10.5px;letter-spacing:.14em;color:var(--gold);font-weight:800;margin-bottom:6px}
.step .sq{padding:0 16px 16px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 6px}.dots i{width:8px;height:8px;border-radius:50%;background:#D5DCE5}.dots i.on{background:var(--gold);width:22px;border-radius:4px}
.pn{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:55;display:flex;gap:8px;padding:8px 12px;background:rgba(244,245,247,.96);border-top:1px solid var(--line)}
.pn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:800;font-family:inherit;color:var(--navy)}
.pn button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}.pn button:disabled{opacity:.4}
body.haspn{padding-bottom:calc(130px + env(safe-area-inset-bottom))}
/* project / prep / memo */
.proj{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.proj .pt{font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}.proj .pt small{font-size:11px;color:var(--gold);letter-spacing:.1em;font-weight:800}
.proj .pv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;margin-top:8px;font-size:.88em}
.proj .pv div b{display:block;font-size:11px;color:var(--sub);font-weight:700}.proj .pv div span{font-weight:800}.proj .pv div span.hv{color:var(--red)}
.form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.form h3{margin:0 0 8px;font-size:1em}
.form label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin:10px 0 4px}
.form input,.form select,.form textarea{width:100%;border:1px solid #C7D0DA;border-radius:9px;padding:11px 12px;font:inherit;font-size:15px;background:#FBFCFD;color:var(--ink)}
.form textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.calc{background:var(--gold2);border:1px solid #E7D9A8;border-radius:10px;padding:10px 13px;margin-top:12px;font-size:.9em}.calc b{color:var(--navy)}
.subtab{display:flex;gap:6px;margin-bottom:12px}
.subtab button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-size:14px;font-weight:800;font-family:inherit;color:var(--sub)}
.subtab button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.prep{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 14px 10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.prep h3{margin:8px 0 6px;font-size:.95em}
.pi{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #EEF1F5;font-size:.95em}.pi:first-of-type{border-top:0}
.pi .ck{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid #B9C2CB;background:#fff;font-size:15px;line-height:22px;text-align:center;color:#fff;cursor:pointer}
.pi.done .ck{background:var(--gold);border-color:var(--gold)}.pi.auto .ck{border-style:dashed}
.pi .pt2{flex:1}.pi.done .pt2{color:var(--sub)}
.pi .pq{border:0;background:none;color:var(--navy);font-weight:800;font-size:12px;font-family:inherit;padding:0;cursor:pointer;text-decoration:underline}
.prog{height:8px;background:#E3E8EF;border-radius:4px;overflow:hidden;margin:6px 0 12px}.prog i{display:block;height:100%;background:var(--gold)}
.memo{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;font-size:.92em}
.memo .mq{font-weight:800}.memo .mm{color:var(--sub);font-size:.9em;margin-top:3px}
.memo .md{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11.5px;color:var(--sub)}.memo .md button{border:0;background:none;color:var(--red);font-weight:700;font-family:inherit;font-size:12px}
.ng{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:12px}
.ng .r{display:grid;grid-template-columns:1fr;gap:4px;padding:9px 0;border-top:1px solid #EEF1F5;font-size:.92em}.ng .r:first-of-type{border-top:0}
.ng .x{color:var(--red);font-weight:800}.ng .x::before{content:"✕ "}.ng .o::before{content:"→ ";color:var(--gold);font-weight:800}
/* docs */
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.doc .dh{display:flex;gap:10px;align-items:center;padding:14px 15px;cursor:pointer}.doc .dh .di{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--gold);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.doc .dh .dt{flex:1;font-weight:800}.doc .dh .ar{color:#9AA5B1;font-size:13px}.doc.open .dh .ar{transform:rotate(180deg)}
.doc .dc{display:none;padding:4px 16px 18px;font-size:.93em;line-height:1.8}.doc.open .dc{display:block}.doc.open .dc img{margin:12px auto}
.dc h1,.dc h2,.dc h3{line-height:1.4;margin:1.2em 0 .5em}.dc h1{font-size:1.2em;border-left:4px solid var(--navy);padding-left:10px}.dc h2{font-size:1.08em}.dc h3{font-size:1em;color:var(--navy)}
.dc table{width:100%;border-collapse:collapse;font-size:.92em;margin:10px 0}.dc td,.dc th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}.dc th{background:#F2F5F8}.dc tr:first-child td{background:#F2F5F8;font-weight:700}
.dc img{max-width:100%;height:auto;display:block;margin:10px auto;border:1px solid var(--line);border-radius:6px}.dc .edn{color:var(--red);font-size:.85em;font-weight:700}
.dc h1[data-hit],.dc h2[data-hit],.dc h3[data-hit]{background:var(--gold2);outline:2px solid var(--gold);padding:4px 8px;border-radius:4px}
.dhit{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:11px 14px;margin-bottom:8px;font-size:.9em;cursor:pointer}
.dhit .src{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.06em;display:block;margin-bottom:3px;margin-top:0}
/* overlays */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:100;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.ov.on{display:flex}
.ov .oh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.ov .oh span{font-size:12px;color:var(--sub);font-weight:800;letter-spacing:.12em}
.ov .oh button{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;font-weight:800;font-family:inherit;font-size:14px;margin-left:6px}
.ov .ob{flex:1;overflow:auto;padding:26px 22px 40px;max-width:900px;margin:0 auto;width:100%}
#pq{font-size:1.35em;font-weight:800;line-height:1.5;margin-bottom:18px}#pq::before{content:"Q　";color:var(--red)}
#pa{font-size:1.45em;line-height:1.9;border-left:6px solid var(--red);padding-left:18px}
#pf{margin-top:22px}#pf img{max-width:100%;border:1px solid var(--line);border-radius:8px}#pf button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:800;font-family:inherit;font-size:14px;margin-bottom:10px}
#fmi{max-width:100%;max-height:70vh;border:1px solid var(--line);border-radius:8px}#fmc{margin-top:12px;font-size:1.05em;font-weight:700}
.foot{margin-top:18px;font-size:11.5px;color:var(--sub);line-height:1.8;text-align:center}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.nums{grid-template-columns:repeat(4,1fr)}.proj .pv{grid-template-columns:repeat(4,1fr)}.ng .r{grid-template-columns:1fr 1.4fr}}
</style>
</head>

<main></main>
<nav class="nav" id="nav"></nav>
<div class="ov" id="pm"><div class="oh"><span>提示モード</span><button id="pmc">閉じる</button></div><div class="ob"><div id="pq"></div><div id="pa"></div><div id="pf"></div></div></div>
<div class="ov" id="fm"><div class="oh"><span>図</span><div><button id="fmn">次の図</button><button id="fmx">閉じる</button></div></div><div class="ob" style="text-align:center"><img id="fmi" alt=""><div id="fmc"></div></div></div>

const QA=[

{c:"melt",s:1,q:"雪はどうやって融けるのですか",
 a:"原則は2段階です。雪は氷ですから、まず0℃まで温めなければ融けません。そして0℃になった雪を水に変えるには、同じ量の水をお風呂よりずっと熱い80℃まで温めるのと同じ大きな熱が要ります。当社のヒーターは路面の下から熱を送り、路面を0℃より少し暖かく保って、触れた雪を順に融かします。雪は気温が0℃より少し高くても降り、路面は気温より冷えることがあるので、気温ではなく路面を暖かく保つことが肝心です。熱は決まった量なので、車輪が通る部分に集中させて確実に効かせます。",
 n:"【数字で聞かれたら】①昇温：雪を0℃まで温める熱は小さい（−5℃の雪で約10kJ/kg）。②融解：0℃の雪を水に変える融解熱は334kJ/kg（水を80℃上げる熱に相当）で、こちらが大半。1時間に1cm積もる雪を融かすだけで約93W/m²、風や放射冷却で逃げる分を含めて200〜300W/m²が寒冷地の目安。路面は放射冷却で気温より2〜3℃低くなることがあり、雪は気温＋2〜3℃でも降る。",t:"融雪 原理 仕組み 融解熱 熱量"},
{c:"melt",s:1,q:"強い雪のとき積もってしまうのはなぜですか",
 a:"降る速さが融かす速さを上回るような強い雪では、どのような融雪設備でも一時的には積もります。ヒーターの熱は一定で、雪の降り方は変わるからです。融雪設備は「降っている最中にすべて消し続ける装置」ではなく、「積もりにくくして、降り止んだ後に路面を早く元に戻す装置」です。その戻りの早さが性能です。",
 n:"この前提を先に共有しておくと、その後の質疑がほぼ想定内に収まります。【数字で聞かれたら】1時間に3cmの降雪では融かすだけで約280W/m²が必要（1cm/hの3倍）。設備の目安200〜300W/m²を超えるため一時的な積雪は避けられない。",t:"積雪 強雪 大雪 融け残り 積もる 性能"},
{c:"melt",s:0,q:"融ける範囲（幅）はどう決まるのですか",
 a:"ヒーターの熱は決まった量なので、広い幅に配るほど薄まり、狭い幅に集めるほど強く効きます。寒くて風の強い日は融ける幅が狭くなり、穏やかな日は広がります。だから車線全体に薄く配るのではなく、車輪が通る部分に集中させて、走行に必要な幅を確実に融かす考え方です。",
 n:"【数字で聞かれたら】面あたりの発熱密度＝出力÷幅。160W/mを有効幅60cmに集めれば約270W/m²、1mに広げれば160W/m²に薄まる。",t:"融雪幅 範囲 轍 集中 出力密度"},
{c:"melt",s:0,q:"なぜ轍部にだけ入れるのですか",
 a:"冬期の走行安全を左右するのは路面全体ではなく、車輪が実際に通る轍部の凍結・圧雪です。轍部に発熱を集中させることで、最小の電力容量と最小の切削量で走行部の安全を確保できます。車線中心から±950mmが、一般的な車両のタイヤ走行位置に対応しています。",
 n:"既設舗装を打ち換えずに、溝を切って挿入・充填するだけで後付けできる点も利点です。",t:"轍 わだち 位置 950 敷設 2条"},
{c:"melt",s:0,q:"降る前から動かす意味はあるのですか（予熱）",
 a:"あります。冷え切ったアスファルトは、温め始めてから暖かくなるまでに30〜40分ほどかかります。雪が降り始めてから温め始めると、路面が暖まる前に積もってしまいます。そこで当社の制御は、気温が下がった段階で先に通電を始め、降る前に路面を温めておきます。これが「予熱」です。",
 n:"当社は気温センサーで運転を許可する方式なので、この予熱が自動的に成立します。【数字で聞かれたら】表層5cmを5℃上げるのに250W/m²で30〜40分（アスファルトの熱容量からの概算）。",t:"予熱 プレヒート 事前 熱容量"},
/* ===== ヒーター制御 ===== */
{c:"ctrl",s:1,q:"ヒーターの温度設定とは何を設定しているのですか",
 a:"ヒーターの出力は160W/mで固定で、温度を狙って出力を変える制御ではありません。設定しているのは通電を入切する判断基準です。ヒーター温度センサーの値が設定値（35〜60℃で地域設定）以下ならON、設定値＋6℃でOFFにする閾値です。結果としてヒーター温度がその帯に保たれ、路面へ安定した熱が流れます。",
 n:"例：設定35℃なら35℃でON・41℃でOFFを繰り返します。",t:"温度設定 設定値 何度 制御 閾値"},
{c:"ctrl",s:1,q:"制御はどういう仕組みですか（一言で）",
 a:"2つの温度で決めています。気温でやるかやらないか、ヒーター温度でいま流すか流さないか。出力は固定で、天候に合わせて自動で通電比率が変わる仕組みです。",
 n:"第1層＝気温センサー（0〜6℃設定）で運転許可。第2層＝ヒーター温度センサー（35〜60℃設定、＋6℃でOFF）で入切。",t:"制御 仕組み 概要 2層 まとめ"},
{c:"ctrl",s:1,q:"晴れているのに動いているのはなぜですか",
 a:"温度制御方式では正常な動作です。気温が設定値以下であれば、降雪の有無に関わらず路面の凍結を予防し、雪が降り出したときに備えて路面を温めておくための通電をしています。降雪を伴わない放射冷却による凍結にも対応できるのが、この方式の利点です。",
 n:"運転時間が過大な場合は、気温設定・ヒーター温度設定・時間帯タイマの見直しで最適化します。",t:"晴れ 動く 無駄 運転 クレーム 苦情"},
{c:"ctrl",s:1,q:"なぜ路面温度ではなくヒーターの温度で制御するのですか",
 a:"熱は温度差で流れるため、熱源であるヒーターの温度を一定に保つことが、路面への熱流を安定させる最も確実な方法です。加えて、雪が融解熱を奪うとヒーター温度が上がりにくくなってON時間が自然に伸びるので、実効出力が天候に自己調整されます。上限を置くことで舗装を熱から守る意味もあります。路面温度はこれらの結果として決まります。",
 n:"上限は設定値＋6℃で最大66℃程度。夏季の路面温度と同等の範囲で、舗装の軟化や充填材の劣化を進める温度ではありません。",t:"路面温度 ヒーター温度 理由 なぜ"},
{c:"ctrl",s:0,q:"設定値を高くすると何が変わりますか",
 a:"ヒーター温度設定を高くすると路面への熱流が増して融雪は強くなりますが、電力費と舗装への熱負荷が増えます。気温設定を高くすると早めに予熱が始まり安全側になりますが、運転時間が増えます。いずれも融雪性能と電力費のバランスを決める設定で、現地の実績を見ながら追い込むのが基本です。",
 n:"気温設定は0〜6℃、ヒーター温度設定は35〜60℃の範囲で決めます。",t:"設定 変更 調整 高く 低く"},
{c:"ctrl",s:0,q:"一日の動きを説明してください",
 a:"まず気温が設定値以下になると運転を許可します。許可中はヒーター温度が設定値未満でON、設定値＋6℃でOFF、冷えて設定値に戻ればまたONという入切を繰り返します。降雪で熱を奪われるとON比率が増えて熱を補い、降り止むとOFF比率が自然に増えます。気温が設定値を超えると運転許可が外れて停止します。",
 n:"実効出力＝160W/m×ON比率。出力を可変にしていないのに、天候に追従します。",t:"動作 流れ 一日 タイムチャート 挙動"},
{c:"ctrl",s:0,q:"降雪センサーは使わないのですか",
 a:"標準構成では使用していません。当社が採用している温度制御方式には、降雪を伴わない凍結にも対応でき、センサー構成が単純で誤検知の要因も少ないという利点があります。発注者様の仕様で降雪検知の併用が指定される場合は、降雪検知と温度条件を組み合わせた構成で対応できます。",
 n:"降雪センサーには光学式・静電容量式・感雨感温式があり、いずれも汚れや霜による誤検知の要因を持ちます。",t:"降雪センサー 雪センサー 検知 使わない"},
{c:"ctrl",s:0,q:"ヒーター温度センサーはどこに付いているのですか",
 a:"切削溝の中で、ヒーターに密着させて設置しています。熱源そのものの温度を測るためです。回路ごとに設置し、充填材で一体化されるため、舗装を壊さない限り交換はできません。",
 n:"そのため設置位置は施工図と写真で記録します。気温センサーは通風シェルター内・地上1.5m程度、盤の排熱を避けた位置に設置します。",t:"センサー 位置 取付 溝 密着"},
{c:"ctrl",s:0,q:"異常はどう検知しますか",
 a:"制御盤はヒーター温度の上限異常・下限異常を検出して扉面に表示し、リセット操作で復帰します。あわせて各回路の電流を変流器で監視しており、温度の異常と電流の監視を組み合わせて故障箇所を切り分けます。",
 n:"上限・下限異常の判定条件（例：通電中に温度が上がらない→断線や開閉器不動作の疑い、停止後も下がらない→開閉器固着の疑い）は実盤の展開接続図で確定させる項目です。確定前は「温度と電流で異常を検出します」の範囲で答えてください。",t:"異常 警報 故障 上限 下限 検知"},
/* ===== 費用 ===== */
{c:"cost",s:1,q:"電気代はどのように決まりますか",
 a:"ヒーター1本（50m）で8kWの電力を使い、それが運転した時間の分だけ電気代になります。ただし運転中ずっと通電しているわけではなく、ヒーターが設定温度に達すると自動で止まり、冷えると再び入ります。穏やかな日ほど止まっている時間が長くなるので、実際の電気代は運転時間から単純に計算した額より少なくなります。",
 n:"【数字で聞かれたら】電力量＝8kW/本×運転時間×ON比率。運転時間は気温設定、ON比率はヒーター温度設定と天候で決まる。高圧受電では基本料金がデマンド（30分平均の最大電力）で決まるため、複数系統を時間差で起動してピークを避けると契約電力を下げられます。",t:"電気代 電力費 コスト ランニング 費用"},
{c:"cost",s:0,q:"契約電力はどう考えればよいですか",
 a:"道路ヒーティングは降雪時に全系統がほぼ同時に全負荷で動くため、一般の建物設備のような低い需要率は使えません。需要率はほぼ1、つまり合計容量で見るのが安全側です。時間差起動などで意図的にピークをずらす設計をしない限り、この前提で契約電力を検討します。",
 n:"一般建物用の需要率をそのまま当てはめると容量不足になります。",t:"契約電力 デマンド 需要率 容量"},
/* ===== 受電・キュービクル ===== */
{c:"power",s:1,q:"キュービクルの役割を簡単に教えてください",
 a:"電力会社から届いた6,600Vの高い電圧を、現場で使える200Vや100Vに変えて配る箱です。やっていることは4つで、受ける・測る・下げる・切る。つまり高圧を引き込み、電力量計で計量し、変圧器で降圧し、事故時には遮断器で瞬時に電気を止めます。",
 n:"鋼板の箱に収める理由は、人が充電部に触れられない、屋外の風雨から守れる、工場製作で品質が安定する、の3点です。",t:"キュービクル 役割 何 受電設備"},
{c:"power",s:1,q:"キュービクルは必要ですか（要否の判断）",
 a:"契約電力50kWが分かれ目です。50kW未満なら低圧受電で電力会社側の柱上変圧器で降圧されるためキュービクルは不要ですが、50kW以上になると高圧受電となり、変圧器をお客さま側で持つ、つまりキュービクルの設置が必要になります。",
 n:"TAIYOSHEET_RHは1本50m＝8kWなので、7本（施工延長350m）で56kWとなり、この付近が境目です。片側1車線（2条）なら道路延長175m前後に相当します。標準的な案件規模である施工延長100〜300m（2〜6本＝16〜48kW）は低圧の範囲に収まります。",t:"キュービクル 必要 要否 50kW 判断 高圧"},
{c:"power",s:1,q:"高圧受電になると何が増えますか",
 a:"設備が自家用電気工作物になるため、保安管理の義務が発生します。具体的には電気主任技術者の選任または外部委託の承認、保安規程の届出、月次点検と年次点検の実施です。加えてキュービクルの設置スペースと基礎、電力会社協議、機器の製作期間が計画に加わります。",
 n:"外部委託承認の対象は、受電電圧7,000V以下で受電する需要設備です（発電設備を併設する場合は出力2,000kW未満などの条件が加わります）。適用の可否は所轄の産業保安監督部で確認します。",t:"高圧 自家用 主任技術者 保安規程 届出 義務"},
{c:"power",s:0,q:"キュービクルの中には何が入っていますか",
 a:"電源側から順に、責任分界点となる区分開閉器、点検時に回路を切り離す断路器、雷サージを大地へ逃がす避雷器、取引用計量の計器用変成器と電力量計、事故電流を遮断する主遮断装置と保護継電器、6.6kVを200V／100Vに落とす変圧器、力率を改善する進相コンデンサが入っています。",
 n:"上から下へ、受電→遮断→降圧→分配と一方向に並びます。",t:"キュービクル 構成 機器 中身 内部"},
{c:"power",s:0,q:"CB形とPF・S形の違いは何ですか",
 a:"事故電流を切る主役の機器が違います。CB形は高圧交流遮断器を使い、受電設備容量4,000kVA以下に適用でき、保護継電器との組合せで細かい保護設定ができます。PF・S形は限流ヒューズと負荷開閉器の組合せで、300kVA以下の小規模向けに構成が簡素で低コストです。容量が形式を決め、形式が価格と保守内容を決めます。",
 n:"PF・S形はヒューズが動作すると交換が必要なため、予備の常備が前提です。",t:"CB形 PFS形 形式 違い 遮断器 ヒューズ"},
{c:"power",s:0,q:"キュービクルの設置スペースはどれくらい必要ですか",
 a:"本体の周囲に保有距離が必要です。点検・操作のための距離として一般に操作面1m以上、点検面0.6m以上、換気面0.2m以上を確保します。加えて消防法の対象となる場合は、建築物その他の工作物から3m以上の距離が求められます。認定キュービクルにはこの緩和規定があります。",
 n:"電気側（保安・点検）と消防側（延焼防止）は根拠も数値も別で、どちらも満たす配置が必要です。該当の有無は所轄消防への事前相談で確定させます。",t:"保有距離 スペース 離隔 3m 設置 用地"},
{c:"power",s:0,q:"責任分界点とは何ですか",
 a:"電力会社の設備とお客さまの設備の境目です。ここより電源側の事故は電力会社、負荷側はお客さまの責任になります。低圧受電では引込線を建物に取り付けた点、高圧受電では構内第1号柱に設ける区分開閉器（PAS／UGS）が分界点です。",
 n:"高圧受電では区分開閉器から先すべてがお客さま設備で、保守も自己負担になります。",t:"責任分界点 分界点 境界 PAS 責任"},
{c:"power",s:0,q:"受電までにどんな手続きが必要ですか",
 a:"電力会社との事前協議で供給地点と引込ルート、責任分界点を決め、契約電力を定めて受電申込を行います。並行して設備の承認図を提出し、保安規程の届出と電気主任技術者の選任または外部委託承認を取得します。据付・接続の後、絶縁耐力試験や保護継電器試験などの自主検査を行い、電力会社立会いで受電します。",
 n:"キュービクルは受注生産で製作期間が長く、電力会社協議と合わせて全体工程のクリティカルパスになります。舗装工事とは別軸で早期に発注時期を確定させてください。",t:"手続き 申込 協議 工程 納期 受電"},
{c:"power",s:0,q:"点検で停電が必要と聞きましたが",
 a:"高圧受電（自家用電気工作物）の場合、年次点検は停電して行います。絶縁抵抗測定、保護継電器の動作試験、接続部の締付確認などを実施するためです。低圧受電では法定の年次点検はありませんが、自主的な絶縁抵抗測定を同じ時期に行うことを推奨します。道路ヒーティングは冬期に止められない設備なので、点検を非降雪期に実施する前提で、発注者・道路管理者と年間の保守計画を事前に合意しておく必要があります。",
 n:"月次点検は無停電での外観・計測です。更新目安は高圧受電設備で概ね15〜20年、屋外設置はこれより短くなります。",t:"点検 停電 年次 月次 保守 更新"},
/* ===== 電線・制御盤 ===== */
{c:"cable",s:1,q:"幹線の太さはどう決めるのですか",
 a:"許容電流で仮決めし、電圧降下で本決めします。まず電流を出し、ケーブルの許容電流がブレーカ定格以上になるサイズを仮に決め、次に電圧降下が許容値以内かを検証して、満たさなければ1サイズ太くします。道路ヒーティングは距離が長いので、多くの場合は電圧降下で決まります。",
 n:"三相200Vの電流は I＝P÷(√3×200)。電圧降下は e＝30.8×L×I÷(1000×A)。許容値の目安はこう長60m以下で2%、120m以下4%、200m以下5%。",t:"幹線 電線 太さ サイズ ケーブル 選定 sq"},
{c:"cable",s:1,q:"なぜ電圧降下が重要なのですか",
 a:"電線が長いと末端で電圧が少し下がりますが、ヒーターは電圧が下がるとその倍近く発熱が落ちる性質があります。電圧が4%下がると発熱は約8%減り、そのまま融雪の効きが弱くなります。モーターなら多少の電圧降下は気になりませんが、ヒーターは性能に直結するため、電線の太さは電圧降下まで確認して決めます。",
 n:"例：16kW・46.2A・こう長80mでCV14sqなら降下4.1%（発熱約8%減）、22sqで2.6%、38sqで1.5%。許容電流だけなら14sqで足りますが22sq以上が妥当です。",t:"電圧降下 2乗 発熱 性能 低下"},
{c:"cable",s:0,q:"どんな種類のケーブルを使いますか",
 a:"屋外・地中の幹線にはCVまたはCVTを使います。導体許容温度90℃で許容電流が大きく、CVTは放熱が良いため幹線の第一候補です。高圧引込にはこれとは別の6.6kV用高圧CVTを使います。公共工事ではハロゲンフリーのエコケーブル（EM-CE等）の指定が標準なので、仕様書の指定記号を必ず確認します。",
 n:"同じCVTでも高圧用と低圧用は絶縁の階級が別の製品で、互いに流用はできません。発注時は電圧階級を明記してください。",t:"ケーブル 種類 CV CVT エコケーブル IV 選定"},
{c:"cable",s:0,q:"制御盤の中には何が入っていますか",
 a:"大きな電流が流れる主回路と、指令をつくる制御回路の二層に分かれています。主回路は主幹ブレーカ、漏電遮断器、開閉デバイス、端子台。制御回路は温度調節計、リレー、タイマ、センサー入力です。当社標準盤ではヒーターの開閉に半導体式のSSRと放熱器を使い、各回路の電流を変流器で監視しています。",
 n:"実盤（50A対応）の例では、漏電遮断器2回路、SSR2台、CT2台、温度調節計4台、24時間タイマを備え、ヒーター回路は別盤のトランス2台を経由します。総重量320kg。",t:"制御盤 中身 構成 SSR 部品 内部"},
{c:"cable",s:0,q:"なぜ電磁接触器ではなくSSRなのですか",
 a:"温度制御方式は設定値の境界付近で入切の回数が多くなります。電磁接触器は機械接点のため開閉回数が寿命に直結しますが、SSRは無接点で接点摩耗がなく頻繁な入切に強いという特性があり、ヒーター制御に適しています。一方で通電中に発熱するため放熱器が必須で、盤内温度と換気の設計に効いてきます。",
 n:"CTによる電流監視は、下限監視でヒーターの断線、上限監視で過電流を検知できます。",t:"SSR 電磁接触器 MC 理由 無接点"},
{c:"cable",s:0,q:"屋外の盤で気をつけることは何ですか",
 a:"浸水と結露です。浸水対策は配管を盤の下面から引き込み、専用の防水コネクタを使い、盤に入る手前で配管を一度下げる水返しを設けること。結露対策は盤内ヒーターとサーモスタットで、寒冷地の屋外盤では欠かせません。加えて日射、積雪高さ、扉の開閉スペース、施錠、基礎の転倒検討が必要です。",
 n:"どれほど保護等級の高い盤でも、配管引込口の処理が悪ければそこから浸水します。",t:"屋外盤 防水 結露 浸水 IP 注意"},
{c:"cable",s:0,q:"トリップとは何ですか",
 a:"ブレーカや遮断器が異常を検知して自動的に回路を遮断することです。日本語では引き外しといいます。原因は過負荷、短絡、漏電の3つです。多くのブレーカはトリップするとハンドルがONとOFFの中間位置で止まるので、復帰するときは一度OFF側まで倒してからONに入れます。",
 n:"トリップは故障ではなく異常を知らせるサインです。特に漏電トリップは、原因を調べずに再投入すると事故の再現になります。",t:"トリップ 遮断 ブレーカ 落ちる 復帰"},
/* ===== 絶縁・保守 ===== */
{c:"ins",s:1,q:"絶縁抵抗とは何ですか。なぜ測るのですか",
 a:"電線や機器の充電部と大地との間の抵抗値で、電気がどれだけ漏れにくいかを表します。絶縁が健全なら数十〜数百MΩ以上、水分の侵入や損傷で劣化すると値が下がります。放置すれば漏電・感電・遮断器のトリップに至るため、事故が起きる前に数値として見える唯一の兆候になります。",
 n:"発熱体は切削溝の中、つまり水の入る環境に埋設されているため、この値の管理が設備の健全性管理そのものになります。",t:"絶縁抵抗 メガー 何 なぜ 測定"},
{c:"ins",s:1,q:"絶縁抵抗はいくら以上必要ですか",
 a:"法律で定められた最低ラインは、ヒーター回路（三相200V）で0.2MΩ以上、制御回路（100V）で0.1MΩ以上です。ただしこれはあくまで下限で、健全な設備はその数十倍から数百倍の値を示します。当社では1MΩ以上を健全の目安とし、何より竣工時の値から年々どれだけ下がっているかという「傾向」で設備の状態を見ています。",
 n:"漏電遮断器（感度30mA）が動作する絶縁抵抗は200V÷30mA≒7kΩで、法定下限の約30分の1。トリップした時点で絶縁はすでに大きく崩れています。",t:"絶縁抵抗 基準 値 0.2MΩ 法定 いくら"},
{c:"ins",s:1,q:"漏電遮断器が落ちました。どうすればよいですか",
 a:"原因を調べずに再投入しないでください。事故の再現行為になります。まず電源を切り、負荷を切り離した状態で回路ごとに絶縁抵抗を測定し、値の低い回路を特定します。次に端子台で盤側・ケーブル側・発熱体側に切り離して区間を絞り込み、原因を補修してから復旧します。",
 n:"盤内なら結露や端子の汚損、ケーブルならハンドホール内の接続部や埋設部の損傷、発熱体なら充填材の破れや端末処理部が疑わしい箇所です。",t:"漏電 トリップ 落ちた 再投入 対処 ELCB"},
{c:"ins",s:0,q:"絶縁抵抗はどう測るのですか",
 a:"絶縁抵抗計（メガー）を使い、低圧回路は500Vレンジで測ります。手順は、停電して検電で無電圧を確認し、SSR・温度調節計・センサー入力を切り離し、回路ごとに電線と大地の間を測定して、値と温湿度・天候・日付を記録します。測定後は放電してから触れてください。",
 n:"SSR・温調計・センサーは半導体を含むため、切り離さずに測ると破損します。電子機器を含む回路は250Vレンジを使います。",t:"絶縁抵抗 測定 方法 手順 メガー 500V"},
{c:"ins",s:0,q:"いつ測ればよいですか",
 a:"竣工時、シーズン前の秋、漏電遮断器がトリップした後、舗装工事や近接掘削の後、そしてシーズン後の春です。特に竣工時の測定値は以後の傾向管理の基準になるので、必ず測定・記録して竣工図書に添付してください。基準値がなければ、後年の値が高いのか低いのか判断できません。",
 n:"測定値は温度・湿度に左右されるため、同じ季節・条件で比較します。",t:"絶縁抵抗 時期 いつ 点検 竣工 記録"},
{c:"ins",s:0,q:"絶縁抵抗を常時監視できますか",
 a:"できます。制御盤に絶縁監視装置（Igr方式）を組み込むと、運転中に対地漏れ電流の有効成分を常時監視し、設定値を超えると警報を出します。停電せずに絶縁低下の進行を検知できるため、重要路線や遠隔地では有効な選択肢です。",
 n:"導入時は初期費用と、警報値の設定（漏電遮断器の動作点より十分手前）を検討します。",t:"絶縁監視 常時 Igr 監視装置"},
/* ===== 舗装・切削 ===== */
{c:"pave",s:1,q:"アスファルトを切って大丈夫なのですか",
 a:"切るのは幅20mm・深さ65mmの細い溝で、表層から基層の上部までの浅い範囲です。道路を支えている路盤には触れません。溝には発熱体を入れたあと充填材を路面まで詰めて閉じるので、溝が開いたまま残ることはなく、路面は連続した状態に戻ります。溝を切って充填材で埋める構造は、交通量計測のループコイルなどで公道に広く使われている方法です。なお、切削と復旧の方法は道路管理者様の承認事項ですので、協議のうえ進めさせていただきます。",
 n:"「グルービングと同じだから問題ない」とは言わない（深さ6mm程度の開放溝と、深さ65mmの充填溝は構造が違い、反論を招く）。グルービングは「舗装に溝を切って供用すること自体は一般的」という背景説明にとどめる。当社の根拠は①路盤に触れない浅い切削、②充填して閉じる、③充填溝の公道実績（ループコイル等）の3点。",t:"切削 大丈夫 グルービング 舗装 溝 実績"},
{c:"pave",s:1,q:"切削した溝の角が欠けませんか",
 a:"切るときに溝の角が数ミリ欠けることはありますが、溝ごと充填材で埋めるので、欠けた部分も一緒に埋まり、路面に段差や隙間は残りません。溝が開いたままだと角に車輪の荷重がかかって傷みが進みますが、当社の溝は閉じるので、その傷み方が起きにくい構造です。また溝幅20mmはタイヤの接地幅のおよそ10分の1で、タイヤが落ち込むことはありません。",
 n:"【数字・根拠で聞かれたら】タイヤ接地幅150〜250mmに対し溝幅20mm。充填して閉じるため水が入らず、凍結融解による損傷拡大も起きない。開放溝（グルービング）で知られる溝縁の摩耗は「自由端に荷重が集中する」ことが原因で、充填溝ではこの条件が成立しない。ループコイル埋設など公道での充填溝の前例あり。実測データ（施工実績・供用後の写真）があれば最も強い。",t:"角欠け 欠け 溝 縁 チッピング 損傷"},
{c:"pave",s:0,q:"充填材を路面より3mm下げるのはなぜですか",
 a:"充填材の剥離を防ぐためです。面一にすると夏季やヒーター運転時の熱膨張で充填材が路面より盛り上がり、タイヤに引きずられて剥離・めくれを起こします。充填材が剥がれた時点で溝縁は完全な自由端になるため、剥離こそが角欠けを招く最大の要因です。コンクリート目地や橋梁の伸縮装置でも、材料上面を数mm低く仕上げるのが標準的な施工慣行です。",
 n:"熱膨張量は概算で約1.2mm上昇（断面868mm²・膨張率6×10⁻⁴/K・ΔT45Kの仮定。係数は充填材メーカー値で確認）。3mmの下げで最大膨張時も路面より低い状態を維持できます。露出は最大3mmで、欠けても充填材上面まで丸まった時点で自己停止します。",t:"3mm 下げ 充填材 目地 凹み 仕上げ"},
{c:"pave",s:0,q:"3mmの凹みに水が溜まって凍りませんか",
 a:"冬期はヒーター運転で溝周辺が氷点を上回るため凍結しにくく、仮に凍っても上面が開いているので氷は上方向に膨張し、縁を押し広げる力になりません。3mmの水深は排水性舗装のきめ深さと同程度で供用上の問題にならず、砂や細粒が自然に詰まって実質的に埋まります。",
 n:"下げを大きくし過ぎると開放溝の性格が強まるため、管理値は中央部3mm・許容2〜4mm・壁面際は充填材を密着とすることを推奨します。",t:"3mm 水 凍る 凹み 溜まる 凍結"},
{c:"pave",s:0,q:"除雪車のブレードで引っかかりませんか",
 a:"引っかかりません。プラウやグレーダーのブレードは路面より出ているものを引っかけて損傷を与えますが、充填材を3mm下げて仕上げているためブレードは両側の舗装面に乗って通過し、充填材にも溝縁にも当たりません。20mmの隙間はブレード長に対して無視できる大きさです。",
 n:"面一や凸の仕上げだと引っかかる対象になります。下げ仕上げは除雪機械との相性という面でも合理的です。",t:"除雪 プラウ ブレード 引っかかる グレーダー"},
{c:"pave",s:0,q:"アスファルトの種類にはどんなものがありますか",
 a:"呼び方は粒度の種類と最大粒径の組合せで、密粒度アスファルト混合物(13)なら最大粒径13mmという意味です。骨材の隙間が多いか少ないかで性格が決まり、標準は隙間が少なく緻密で水を通さない密粒度、交通量の多い国道の表層には空隙20%前後で水を通す排水性、重交通や橋面には耐久性を高めた改質アスファルトが使われます。",
 n:"見分け方：表面がびっしり詰まって見える→密粒度、雨でも水はねが少ない→排水性、交差点・急勾配・橋の上→改質の可能性が高い。",t:"アスファルト 種類 密粒度 排水性 改質 アスコン"},
{c:"pave",s:0,q:"舗装の種類で融雪に違いは出ますか",
 a:"出得ます。排水性舗装は空隙が多いため密粒度より熱伝導率が低く、熱が横に広がりにくい傾向があります。同じヒーター出力でも融雪の挙動が変わり得るため、対象路線の表層種別は現地調査・設計協議の段階で必ず確認します。後から判明すると設計と見積の前提が崩れます。",
 n:"切削幅20mmで復旧が認められるかどうかも、舗装の種類と管理者の復旧基準による判断になります。",t:"排水性 融雪 影響 熱伝導 表層 違い"},
{c:"pave",s:0,q:"道路構造はどうなっているのですか",
 a:"上から表層4〜5cm、基層5〜10cm、上層路盤10〜20cm、下層路盤15〜30cm、その下が路床です。上の層ほど強く緻密な材料で、荷重を分散させながら地盤へ伝えます。当社の切削65mmは表層を貫通して基層の上部までで、路盤には触りません。",
 n:"設計では層ごとの強さを換算して合計したTA（等値換算厚）で、交通量区分ごとの必要厚を配分します。",t:"道路構造 表層 基層 路盤 層 厚さ"},
{c:"pave",s:0,q:"国道と県道で何が違うのですか",
 a:"構造そのものより、管理者と基準が違います。占用許可の申請先と審査基準、舗装復旧基準、埋設物の土被り基準、交通規制の条件、標準仕様書や積算基準が管理者ごとに異なります。したがって対象路線の管理者を特定し、その管理者の舗装復旧基準と占用基準を早期に確認することが計画上の要点です。",
 n:"一般国道でも指定区間は国土交通省、指定区間外は都道府県が管理します。同じ国道でも協議相手が変わります。交通量の多い県道が国道より重装備であることも普通にあります。",t:"国道 県道 違い 管理者 占用 復旧基準"},
{c:"pave",s:0,q:"施工数量はどう拾うのですか",
 a:"敷設位置が轍部に固定されているので、条数は計算するものではなく片側1車線あたり2条が標準です。施工延長は道路延長×2条、ユニット数は各条で道路延長÷50mの切上げ（1本50m固定）、所要電力は本数×8kWです。切削は施工延長×20mm×65mm、充填材は約0.87L/m・条で機械的に算出できます。",
 n:"例：道路延長150m・片側1車線なら施工延長300m、6本、48kW。工程は標準日進50m/日で6日＋電気接続・試験。",t:"数量 拾い 積算 延長 ユニット 見積"},
/* ===== 答えられないとき ===== */
{c:"fall",s:1,q:"答えられない質問をされたときは",
 a:"「その点は正確にお答えしたいので、確認して折り返します」と伝えてください。憶測で答えるより信頼を損ねません。持ち帰るときは、①誰が何を聞いたか、②何を判断するために必要な情報か、③いつまでに必要か、の3点をメモしてください。",
 n:"特に次は必ず持ち帰る事項です。契約や性能の保証に関わる数値／舗装復旧の可否など管理者判断が絡むもの／個別案件の具体的な設計値・見積金額／法令適用の最終判断。",t:"わからない 答えられない 持ち帰り 確認"},
{c:"fall",s:1,q:"この資料の数値をそのまま示してよいですか",
 a:"社内説明や概要の説明には使えますが、契約・性能保証・提出図書には使わないでください。融解熱や熱容量は一般的な物理量の概算、法令数値は基準に基づく一般値です。設定値・容量・電線サイズ・復旧方法は案件ごとの設計図書、メーカー仕様書、管理者協議で確定します。",
 n:"迷ったら「概要としてはこうです。正式な数値は設計図書でご確認いただきます」と前置きしてください。",t:"数値 根拠 使用 注意 免責 保証"}
];
/* ===== 追加：用語（他部門向け） ===== */
QA.push(
{c:"term",s:0,q:"轍部（わだちぶ）とは",a:"車輪が繰り返し通る路面の位置のことです。当社のヒーターは車線中心から±950mmのこの位置に2条を敷設し、走行安全に直結する部分に熱を集中させています。",n:"",t:"轍 わだち 用語"},
{c:"term",s:0,q:"縦入れ工法とは",a:"厚さ9mm×高さ48mmの発熱体を、幅20mm×深さ65mmの切削溝に立てて（9mm面を溝幅方向にして）挿入する当社の施工方法です。挿入後にポリブタジエン系の充填材で埋め戻します。",n:"発熱体の上には17mmの充填材のかぶりができます。",t:"縦入れ 工法 施工 用語"},
{c:"term",s:0,q:"充填材（グラウト）とは",a:"切削溝と発熱体の隙間を埋める材料で、当社ではポリブタジエン系の可とう性材料を使います。溝を閉じて縁を支え、水の侵入を防ぎ、アスファルトの伸縮に追従します。",n:"必要量は概算で約0.87L/m・条です。",t:"充填材 グラウト ポリブタジエン 用語"},
{c:"term",s:0,q:"自家用電気工作物とは",a:"高圧（600V超）で受電する設備や一定規模以上の設備のことで、電気事業法上、設置者に保安の責任が生じます。電気主任技術者の選任または外部委託、保安規程の届出、定期点検が必要になります。",n:"キュービクルを設置した時点で該当します。",t:"自家用電気工作物 用語 保安"},
{c:"term",s:0,q:"デマンドとは",a:"30分ごとの平均使用電力のことです。高圧受電では、その月の最大値が契約電力と基本料金に反映されます。複数系統を時間差で起動して同時ピークを避けると、契約電力を下げられます。",n:"",t:"デマンド 契約電力 用語 基本料金"},
{c:"term",s:0,q:"需要率とは",a:"設備容量に対して実際に同時に使う最大電力の割合です。一般の建物では1未満で見ますが、道路ヒーティングは降雪時に全系統が同時に全負荷で動くため、ほぼ1として扱います。",n:"",t:"需要率 用語 容量"},
{c:"term",s:0,q:"SSR（ソリッドステートリレー）とは",a:"半導体で電流を入切する無接点の開閉器です。機械接点がないため摩耗せず頻繫な入切に強い反面、通電中に発熱するため放熱器が必須です。当社標準盤ではヒーターの開閉に使っています。",n:"",t:"SSR 用語 開閉器 無接点"},
{c:"term",s:0,q:"CT（変流器）とは",a:"回路に流れる電流を検出する装置です。当社の制御盤では各ヒーター回路にクランプCTを付け、電流の下限監視で断線を、上限監視で過電流を検知します。",n:"",t:"CT 変流器 用語 電流"},
{c:"term",s:0,q:"ハンドホール（HH）とは",a:"地中に設ける点検・接続用の箱で、地中版のプルボックスです。ケーブルの接続・点検・余長の収納に使い、曲がり点や分岐点、長距離区間の中間（目安30〜50mごと）に設けます。",n:"管口はシールで必ずふさぎ、呼び線を残しておくと後年の増設が掘削なしでできます。",t:"ハンドホール HH 用語 地中"},
{c:"term",s:0,q:"FEP管（エフレックス）とは",a:"地中管路に使う波付硬質ポリエチレン管です。「エフレックス」は商品名が通称化したもので、図面では「FEP管」と表記します。軽くて長尺、可とう性があり、樹脂製なので管自体の接地が不要です。",n:"紫外線と衝撃に弱いため地中専用で、地上の立上り部は必ずG管（厚鋼電線管）に切り替えます。",t:"FEP エフレックス 管 用語 地中"},
{c:"term",s:0,q:"占用許可とは",a:"道路の地下や路面に自社の設備を設置するために、道路管理者から受ける許可です。申請先と審査基準、埋設物の土被り基準、舗装復旧基準は管理者（国土交通省・都道府県・市町村）ごとに異なります。",n:"対象路線の管理者の特定と、その復旧基準の早期確認が計画上の要点です。",t:"占用 許可 道路管理者 用語"},
{c:"term",s:0,q:"表層・基層・路盤とは",a:"アスファルト舗装の層の名前です。上から表層（4〜5cm）、基層（5〜10cm）、上層路盤、下層路盤、その下が路床です。当社の切削65mmは表層を貫通して基層の上部までで、路盤には触りません。",n:"",t:"表層 基層 路盤 路床 用語 層"},
{c:"term",s:0,q:"融解熱とは",a:"氷（雪）を同じ温度の水に変えるために必要な熱です。334kJ/kgで、同じ量の水を0℃から80℃まで温める熱に相当します。融雪に必要な熱の大半がこの融解熱です。",n:"",t:"融解熱 潜熱 用語"},
{c:"term",s:0,q:"実効出力とは",a:"通電のON比率を掛けた実際の平均出力です。当社のヒーターは160W/mで固定ですが、ヒーター温度による入切で通電比率が変わるため、実効出力＝160W/m×ON比率となり、天候に応じて自動的に変わります。",n:"",t:"実効出力 ON比率 用語"},
/* ===== 追加：よく聞かれる実務質問 ===== */
{c:"pave",s:0,q:"工期はどれくらいかかりますか",a:"発熱体の敷設工事は標準日進50m（1本）／日が目安です。例えば道路延長150m・片側1車線（施工延長300m・6本）なら発熱体工事で6日、これに電気接続・試験の工程が加わります。キュービクル新設を伴う場合は、電力会社協議と機器製作が別軸で全体工程を左右します。",n:"正式な工程は現地条件・交通規制・管理者協議で決まるため、個別案件の日数は持ち帰って回答してください。",t:"工期 日数 期間 日進 スケジュール"},
{c:"pave",s:0,q:"他の融雪方式と何が違うのですか",a:"当社方式の特徴は3点です。①既設舗装に溝を切って挿入・充填するだけで、打ち換えなしに後付けできること。②車輪が通る轍部に熱を集中させ、最小の電力容量で走行部の安全を確保すること。③気温とヒーター温度の2層制御で、実効出力が天候に自己調整されること。",n:"他社製品の性能や価格に関する比較は憶測で答えず、比較資料の有無を確認して持ち帰ってください。",t:"違い 比較 他社 特徴 メリット"},
{c:"fall",s:0,q:"保証・耐用年数・実績を聞かれたら",a:"契約・性能保証・耐用年数・施工実績の具体は、この場では正確にお答えしたいので確認して折り返します、と伝えて持ち帰ってください。憶測の数字を出してはいけない項目です。",n:"持ち帰るときは、相手が何を判断するために必要としているか（比較検討・予算化・仕様書作成など）を必ず聞き取ってください。回答の粒度が変わります。",t:"保証 耐用年数 実績 寿命 メンテ契約"}
);

const DOCS=[{"id": "TAIYOSHEET_RH_ヒーター制御の考え方", "title": "ヒーター制御の考え方（詳細版）", "cat": "ctrl", "html": "<p><strong>説明資料</strong></p>\n<p><strong>TAIYOSHEET_RH ヒーター制御の考え方</strong></p>\n<p>― 雪が融ける仕組みと、温度制御方式の説明 ―</p>\n<p>株式会社太陽　TAIYOSHEET計画推進部　　2026年9月2日</p>\n<h1>1．この資料の目的</h1>\n<p>道路ヒーティングの説明では、「ヒーターの温度設定とは何を決めているのか」「なぜ路面の温度ではなくヒーターの温度で制御するのか」「晴れているのに動いているのはなぜか」といったご質問をいただきます。本資料は、これらに一貫した考え方で回答できるよう、①雪が融ける仕組みを簡単に押さえ、②その上で当社の制御方式を説明し、③想定される質問への回答例をまとめたものです。</p>\n<p>説明の順番も、この①→②→③のとおりに話すと伝わりやすくなります。「なぜその制御なのか」は、「雪がどう融けるか」から説明したときに初めて納得していただけるからです。</p>\n<h1>2．雪が融ける仕組み（簡単に）</h1>\n<h2>2.1　雪を融かすには「熱」が要る</h2>\n<p>雪が融けるとは、0℃の雪（氷）が0℃の水に変わることです。温度は変わらないのに、この変化には大きな熱が必要で、これを融解熱といいます。路面から雪へ供給しなければならない熱は、次の4つに分けて考えると整理できます。</p>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><strong>熱の使われ方</strong></td>\n<td><strong>内容</strong></td>\n<td><strong>大きさの目安</strong></td>\n</tr>\n<tr class=\"even\">\n<td>融解熱</td>\n<td>0℃の雪を0℃の水に変える</td>\n<td>334kJ/kg（最大の項目）</td>\n</tr>\n<tr class=\"odd\">\n<td>昇温</td>\n<td>−5℃の雪を0℃まで温める</td>\n<td>約10kJ/kg（小さい）</td>\n</tr>\n<tr class=\"even\">\n<td>表面からの損失</td>\n<td>風による対流、夜間の放射冷却</td>\n<td>気象条件で大きく変動</td>\n</tr>\n<tr class=\"odd\">\n<td>下向きの損失</td>\n<td>路盤へ逃げる熱</td>\n<td>断熱層がなければ相当量</td>\n</tr>\n</tbody>\n</table>\n<h2>2.2　どれくらいの熱が必要か</h2>\n<p>密度0.1の新雪が1時間に1cm降ると、水に換算して1m²あたり1kgです。これを融かす融解熱は334kJ/m²·h、電力に換算すると約93W/m²になります。これに風や放射による損失が上乗せされるため、寒冷地の融雪設計では「200〜300W/m²程度」が目安として用いられます。</p>\n<p>逆に、1時間に3cmの強い降雪では融解だけで約280W/m²が必要になり、どのような融雪設備でも一時的には雪が積もります。<strong>融雪設備は「降っている最中に完全に消し続ける装置」ではなく、「積もりにくくし、降り止んだ後に路面を速やかに回復させる装置」である</strong>という点は、説明の前提として共有しておくべき事実です。</p>\n<h2>2.3　熱は温度差で流れる</h2>\n<p>ヒーターの熱は、アスファルトの中を伝わって路面に達し、路面から雪へ渡ります。熱は温度の高い側から低い側へ、その温度差に応じて流れます。路面が0℃付近であるとき、ヒーターの温度が高いほど路面へ向かう熱の流れは強くなります。当社の制御がヒーター自身の温度を管理する理由は、この「温度差が熱を押し上げる原動力である」という点にあります（第3章）。</p>\n<p><img\nsrc=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCws 風が強いほど幅は狭く、穏やかな日ほど広くなります。</p>\n<p>車線中心から±950mmの轍部（車輪が通る位置）に2条を配置する設計は、限られた出力を車線全面に薄く配るのではなく、走行安全に直結する車輪の通る幅に集中して使うという、熱収支上の合理に基づいています。</p>\n<h2>2.5　「予熱」が効く</h2>\n<p>アスファルトには熱容量があり、冷え切った路面を温めるには時間がかかります。概算では、表層5cmを5℃上げるのに250W/m²で30〜40分を要します。雪が降り始めてから温め始めると、路面が0℃に達する前に雪が積もってしまいます。降り出す前に路面を温めておく「予熱」が融雪の効果を大きく左右し、当社の制御方式はこの予熱が自動的に成立する構造になっています（3.2節）。</p>\n<h1>3．当社のヒーター制御（2層の温度制御）</h1>\n<h2>3.1　出力は固定、制御しているのは「通電の時間と比率」</h2>\n<p>ヒーターの出力は160W/m（1本50m＝8kW）で固定されており、出力の大きさを変える制御は行っていません。制御盤が操っているのは<strong>「いま通電するか、しないか」と、その結果としての「通電時間の比率」</strong>です。融雪に投入されるエネルギーは「160W/m\n×\n通電時間」で決まります。この点を最初に明確にすると、「温度設定＝ヒーターを何度にするか」という誤解を避けられます。</p>\n<h2>3.2　第1層：運転の許可（気温センサー）</h2>\n<p>気温センサーの値が設定値以下のときだけ、運転を許可します。設定値は現地の気象条件に応じて0〜6℃の範囲で選びます。6℃側に置けば早めに予熱が始まり安全側（電力費は増える）、0℃側に置けば節電側です。暖かい日に無駄な通電をしないための上限であると同時に、冷え込みの段階で許可が出ることで、雪が降る前の予熱が自動的に成立します。</p>\n<h2>3.3　第2層：通電の入切（ヒーター温度センサー）</h2>\n<p>切削溝の中でヒーターに密着させたヒーター温度センサーの値で、通電の入切を行います。設定値は地域ごとに35〜60℃の範囲で選び、ヒーター温度が設定値以下になるとON、設定値＋6℃に達するとOFFします（動作すきま6℃）。たとえば設定値が35℃なら、35℃でON・41℃でOFFを繰り返し、ヒーター温度は35〜41℃の帯に保たれます。</p>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><strong>項目</strong></td>\n<td><strong>内容</strong></td>\n</tr>\n<tr class=\"even\">\n<td>測るもの</td>\n<td>切削溝内のヒーター自身の温度（路面温度ではない）</td>\n</tr>\n<tr class=\"odd\">\n<td>動作</td>\n<td>設定値以下でON、設定値＋6℃でOFF（動作すきま6℃）</td>\n</tr>\n<tr class=\"even\">\n<td>設定範囲</td>\n<td>35〜60℃の範囲で地域・現地条件により設定</td>\n</tr>\n<tr class=\"odd\">\n<td>例</td>\n<td>設定35℃ → 35℃でON／41℃でOFF</td>\n</tr>\n<tr class=\"even\">\n<td>取付位置</td>\n<td>切削溝内でヒーターに密着（回路ごと）</td>\n</tr>\n</tbody>\n</table>\n<h2>3.4　なぜ路面温度ではなく、ヒーター温度を管理するのか</h2>\n<ol type=\"1\">\n<li><p><strong>路面への熱流を安定させる。</strong>熱は温度差で流れるため（2.3節）、熱源であるヒーターの温度を一定の帯に保てば、路面へ向かう熱の流れが安定します。路面温度は目標ではなく、その結果として決まる値です。</p></li>\n<li><p><strong>実効出力が天候に自己調整される。</strong>雪が融解熱を奪うとヒーター温度は上がりにくくなり、ONの時間が自然に長くなります。穏やかな日はすぐに設定値＋6℃に達してOFFが長くなります。出力を可変にしていないのに、実効出力（160W/m\n× ON比率）が天候に追従します。</p></li>\n<li><p><strong>舗装・充填材・ヒーターを守る。</strong>上限側（設定値＋6℃、最大でも66℃程度）を置くことで、夏季の路面温度に相当する60℃を超える熱を長時間与えず、舗装の軟化や充填材の劣化を防ぎます。</p></li>\n<li><p><strong>故障の検知に使える。</strong>通電しているのに温度が上がらなければ断線などの異常（下限異常）、通電を止めても下がらなければ開閉器の固着などの異常（上限異常）と判定でき、電流監視（CT）と組み合わせて切り分けられます。</p></li>\n</ol>\n<h2>3.5　一日の動き</h2>\n<p><img\nsrc=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAK7A+gDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAYHAwQFAQII/8QAYBAAAQMDAQMEBxUEBQoFAwQDAQACAwQFEQYHEiETMUFRFRdXcYGy0RQWIjI2N1VWYXJzdJGSk5SVobGz0iM1OFQIM0KC0yQlJjRSg6LBwsNDRWKE4VNk8BhEY6MndXb/xAAaAQEAAwEBAQAAAAAAAAAAAAAAAQIDBAUG/8QAQREAAgECAwQHBQUHAwUBAQAAAAECAxEEEiETMUFRBWFxkaGx0SIygcHwFDM0U3IVIzVSc4LhQpKyQ2JjosIk8f/aAAwDAQACEQMRAD8A/SKIiAIiIAiIgCIiAItSG60NTdKm2w1cUlbSNY+eFrsvjD87pI6M4OFtoAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAImR1pkdaAImR1pkdaXARMjrTI60uAiZHWmR1pcBEyOtMjrS4CJkdaZHWlwETI60yOtLgImR1pkdaXARMjrTI60uAiZHWmR1pcBEyOtMjrS4CJkdaZHWlwETI60yOtLgImR1pkdaXARMjrTI60uAiZHWmR1pcBEyOtMjrS4CJkdaZHWlwETI60yOtAETI60yOtLgImR1pkdaXARMjrTI60uAiZHWmR1pcBEyOtMjrS4CJkdaZHWlwETI60yOtLgImR1pkdaXARMjrTI60uAiZHWmR1pcBEyOtMjrS4CJkdaZHWlwETI60yOtLgImR1pkdaXARMjrTI60uAiZHWmR1pcBEyOtMjrS4CJkdaZHWlwETI60yOtLgImR1pkdaXARMjrTKAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgK+016+mtviVu8WRWCq+016+utviVu8WRWCgCIiAKM3nX1ksN+barhLJFIYxIZAzeYzOcA449HUpMuXd9N2e+x7tyt8NQeh5bh47zhxClW4kPqNqgulDdKcT0FXDVRn+1E8O/DmW0qyuGyN9HUGr01eJ6GccQyRx8dvH5QVqjVeu9Iehvtr7I0jeedo6Pft4fOCtlvuZF7by10UOsm1DTl43Y5Kk0E7uG5U+hGfcdzKXskZIwPY5r2OGQ5pyCqtNbyU7n0iIoJCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAh5iiHmKMGsiIuQ2CIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAtO6ur2WuZ9sbE6raMsbKDuu6xw6StxczUMD5rHUOZWz0boWmUSQuDT6EE4JPQVSfustD3kRq7alvtE8yyReYojTslbEaYykOx6JpdkAcVm09f7zdLjTgvZLTOhdLIHUpiwd30IDskHiRxUTur57nbKCulFRUPZbuTkkMLnAu3ic7+6R0+4unoaPzHdm1csU8cclEWbxp3hvDDi4v3QMYB6/CvIhWm6qV3bt+kejKlFU27anQg1ndJNRmlcbOYuTb6AVo3Ml2Dh+OLv/Su8+TVoncGUdrMW8d0mV+d3PDo58KrqfknV7YDX0+5hn7QTHcI5QnA9BnPHm6+k8wkL HGrzF/VsdJnk87u+B6HqQH6CRV/sbnkn0hXmQuwy7VbGMLpHCNokwGjlAHgDmAcAesBT7lGA+nb8qA+kXC1Fqqm0yaOethf2Omk5KesaQWUhPpXSDnDSeG9zDhnAXbY9ksbZI3B7HDIc05BHWgPpERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREAREQBERAEREBT1s0lqe61dDR1dtdbLZQ3mvrPNkdcYql7ZDMGlrA3LeLwc73Ed9cu8WCeSjsEF4uN9pbr2fgpZIX3iSVr27zsTw5O8ARxBPEcR0ZV6rRlsdpnu8d1ltdHJcYm7rKp8DTMwceAfjIHE9PSUBX99Y6h2iV0cU8xfT6OnDZXSEyZbLwcXc5dwznrUK0xVeZq7R1eLqwh00b617WV0ZDDTvyZZJpDEW727ngMkjHUr8NDSGu82mmhNVyfI8tuDf3M53d7n3c8cc2UrKCkuNFJR1tLDVUsrd2SGZgex46i08CEBDtlssdRar/ADwyNlikv9e9j2ODmuBmOCCOBC6FTsz0XV1UtTUaYtks0zi973U4Jc4nJJUgoaCjtlHHSUFJBR00fBkMEYjY3vNHALYQFcai2Maau/mOlobNardRGQurXw04E8jBzMjd/Zyed3Pjm51Prfb6S026noKGnZTUtMwRxRMGGsaOYBbKIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgP/9k=\"\nstyle=\"width:6.45833in;height:4.30208in\" /></p>\n<p>図2　2層制御の動き：気温で運転を許可し、許可中はヒーター温度が設定値でON・＋6℃でOFFを繰り返す。ON比率が天候で変わる</p>\n<ol type=\"1\">\n<li><p>気温が設定値（0〜6℃）以下になる → 運転を許可。</p></li>\n<li><p>ヒーター温度が設定値未満 → ON。設定値＋6℃に達する →\nOFF。冷えて設定値に戻る → ON。この入切を繰り返す。</p></li>\n<li><p>降雪で融解熱を奪われる → ヒーター温度が上がりにくい →\nON比率が増えて熱を補う。</p></li>\n<li><p>降り止む → 温度が上がりやすくなり →\nOFF比率が自然に増える。</p></li>\n<li><p>気温が設定値を超える → 運転許可が外れて停止。</p></li>\n</ol>\n<p>電力費は「8kW/本 × 運転時間 ×\nON比率」で決まります。運転時間だけでなくON比率が効くため、気温設定とヒーター温度設定の2つが、融雪性能と電力費を秤にかけるダイヤルになります。</p>\n<h1>4．よくいただく質問と回答例</h1>\n<p><strong>Q．ヒーターの温度設定とは何ですか。ヒーターを何度にする設定ですか。</strong></p>\n<p><strong>A．</strong>ヒーターの出力は160W/mで固定で、温度を狙って出力を変える制御ではありません。設定しているのは「通電を入切する判断基準」で、ヒーター温度センサーの値が設定値（35〜60℃で地域設定）以下ならON、設定値＋6℃でOFFにする閾値です。結果としてヒーター温度がその帯に保たれ、路面へ安定した熱が流れます。</p>\n<p><strong>Q．なぜ路面の温度ではなく、ヒーターの温度で制御するのですか。</strong></p>\n<p><strong>A．</strong>熱は温度差で流れるため、熱源であるヒーターの温度を一定に保つことが、路面への熱流を安定させる最も確実な方法です。加えて、雪が融解熱を奪うとヒーター温度が上がりにくくなってON時間が自然に伸びるので、実効出力が天候に自己調整されます。上限を置くことで舗装を熱から守る意味もあります。路面温度はこれらの結果として決まります。</p>\n<p><strong>Q．設定値を高くすると、何が変わりますか。</strong></p>\n<p><strong>A．</strong>ヒーター温度設定を高くすると路面への熱流が増して融雪は強くなりますが、電力費と舗装への熱負荷が増えます。気温設定を高くすると早めに予熱が始まり安全側になりますが、運転時間が増えます。いずれも「融雪性能と電力費」のバランスを決める設定で、現地の実績を見ながら追い込むのが基本です。</p>\n<p><strong>Q．晴れていて雪が降っていないのに動いているのはなぜですか。</strong></p>\n<p><strong>A．</strong>温度制御方式では正常な動作です。気温が設定値以下であれば、降雪の有無に関わらず路面の凍結を予防し、雪が降り出したときに備えて路面を温めておく（予熱）ための通電です。降雪を伴わない放射冷却による凍結にも対応できるのが、この方式の利点です。運転時間が過大であれば、気温設定・ヒーター温度設定・時間帯タイマの見直しで最適化します。</p>\n<p><strong>Q．強い降雪のとき、一時的に雪が積もるのはなぜですか。</strong></p>\n<p><strong>A．</strong>1時間に3cmの降雪では、融解だけで約280W/m²の熱が必要になり、どのような融雪設備でも供給が追いつかず一時的に積もります。融雪設備は「積もりにくくし、降り止んだ後に路面を速やかに回復させる装置」であり、その回復の早さが性能です。轍部に熱を集中させる設計は、この回復を車輪の通る位置で優先させる考え方です。</p>\n<p><strong>Q．電力費はどのように決まりますか。</strong></p>\n<p><strong>A．</strong>「8kW/本 × 運転時間 ×\nON比率」です。運転時間は気温設定で、ON比率はヒーター温度設定と天候で決まります。降雪の少ない穏やかな日はON比率が下がるため、実際の消費電力量は「8kW/本\n× 運転時間」よりも小さくなります。</p>\n<p><strong>Q．降雪センサーは使わないのですか。</strong></p>\n<p><strong>A．</strong>標準構成では使用していません。温度で判定する方式は、降雪を伴わない凍結にも対応でき、センサー構成が単純で誤検知の要因も少ないためです。発注者様の仕様で降雪検知の併用が指定される場合は、「降雪検知\nAND 温度条件」の構成で対応できます。</p>\n<p><strong>Q．異常はどのように検知しますか。</strong></p>\n<p><strong>A．</strong>制御盤の温度調節計が、通電しているのにヒーター温度が上がらない場合を「下限異常」（断線・開閉器不動作の疑い）、通電を止めても下がらない場合を「上限異常」（開閉器固着の疑い）として表示します。各回路の電流を変流器（CT）で監視しており、これらを組み合わせて故障箇所を切り分けます。</p>\n<h1>5．まとめ（説明の骨子）</h1>\n<ol type=\"1\">\n<li><p>雪を融かす熱の大半は融解熱（334kJ/kg）で、熱は温度差で路面へ流れる。融雪の幅は実効出力÷幅で決まり、強い降雪では一時的に積もるのが物理である。</p></li>\n<li><p>当社の制御は2層。気温（0〜6℃設定）で運転を許可し、ヒーター温度（35〜60℃設定、＋6℃でOFF）で通電を入切する。出力は160W/m固定で、実効出力はON比率で天候に自己調整される。</p></li>\n<li><p>路面温度は目標ではなく結果。ヒーター温度を管理することで熱流の安定・自己調整・舗装保護・故障検知を同時に実現している。</p></li>\n</ol>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>数値の扱いについて</strong></p>\n<p>融解熱・熱容量などは一般的な物理量に基づく概算値です。設定値（気温0〜6℃、ヒーター温度35〜60℃）は現地条件に応じて決定します。契約や性能保証に関わる説明では、案件ごとの設計図書・仕様書を優先してください。</p></td>\n</tr>\n</tbody>\n</table>\n<h1>6．参考：前提とする製品・設備仕様</h1>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><strong>項目</strong></td>\n<td><strong>仕様</strong></td>\n</tr>\n<tr class=\"even\">\n<td>発熱体</td>\n<td>厚さ9mm × 高さ48mm、長さ50m/本、出力160W/m（1本＝8kW）</td>\n</tr>\n<tr class=\"odd\">\n<td>敷設</td>\n<td>車線中心から±950mmの轍部に2条（片側1車線あたり）、縦入れ工法</td>\n</tr>\n<tr class=\"even\">\n<td>切削・充填</td>\n<td>幅20mm × 深さ65mm、充填材：ポリブタジエン系</td>\n</tr>\n<tr class=\"odd\">\n<td>センサー</td>\n<td>気温センサー（運転許可）、ヒーター温度センサー（溝内でヒーターに密着・通電入切）</td>\n</tr>\n<tr class=\"even\">\n<td>制御盤</td>\n<td>漏電遮断器×2回路、SSR＋放熱器で開閉、クランプCTで電流監視、デジタル温度調節計、24時間タイマ、上限・下限異常表示</td>\n</tr>\n<tr class=\"odd\">\n<td>設定値</td>\n<td>気温：0〜6℃の範囲で現地設定／ヒーター温度：35〜60℃の範囲で地域設定、動作すきま＋6℃</td>\n</tr>\n</tbody>\n</table>\n"}, {"id": "TAIYOSHEET_RH_ヒーター制御_口頭説明用要約", "title": "ヒーター制御・口頭説明用要約（1枚）", "cat": "ctrl", "html": "<p><strong>口頭説明用・要約版（約3分）</strong></p>\n<p><strong>TAIYOSHEET_RH　ヒーター制御の考え方</strong></p>\n<p>雪が融ける仕組みと、温度制御方式　―　株式会社太陽\nTAIYOSHEET計画推進部　2026年9月</p>\n<h2>1　まず一言で（30秒）</h2>\n<p>雪を融かすには、思っているよりずっと大きな熱が要ります。当社のヒーターは、その熱を「温度差」で路面へ押し上げ、車輪が通る轍部に集中させて融かします。制御は出力を変えるのではなく、「いつ通電するか」を気温とヒーター温度の2つで決めています。</p>\n<h2>2　雪が融ける仕組み ― 3つだけ覚える（1分）</h2>\n<ol type=\"1\">\n<li><p><strong>融けるだけで大きな熱。</strong>雪は0℃のまま水に変わりますが、その熱は「同じ量の水を0℃から80℃まで温める熱」と同じです。1時間に1cmの雪を融かすだけで約93W/m²、損失を含めて200〜300W/m²が寒冷地の目安になります。</p></li>\n<li><p><strong>熱は温度差で流れる。</strong>ヒーター（35〜41℃）→アスファルト→路面（0℃付近）→雪。この温度差が熱を押し上げる原動力です。だからヒーターの温度を管理します。</p></li>\n<li><p><strong>幅は出力で決まる、だから轍部に集中。</strong>面あたりの熱＝出力÷幅。車線全面に薄く配るより、車輪の通る幅に使い切る方が確実に効きます。なお1時間3cmの強い雪は融解だけで約280W/m²が要り、どんな設備でも一時的に積もります。融雪設備は「積もりにくくし、降り止んだ後に早く回復させる装置」です。</p></li>\n</ol>\n<h2>3　当社のヒーター制御 ―\n出力は固定、決めるのは通電のタイミング（1分）</h2>\n<ol type=\"1\">\n<li><p><strong>気温で「運転するかしないか」。</strong>気温が設定値（0〜6℃で現地設定）以下なら運転を許可。冷え込みの段階で許可が出るので、雪が降る前に路面を温めておく「予熱」が自動的にできます。</p></li>\n<li><p><strong>ヒーター温度で「いま流すか流さないか」。</strong>溝の中でヒーターに密着したセンサーが、設定値（35〜60℃で地域設定）でON、設定値＋6℃でOFF。例えば35℃設定なら、35℃でON・41℃でOFFを繰り返します。</p></li>\n<li><p><strong>天候に自動で合う。</strong>雪が熱を奪えばヒーター温度は上がりにくくONが長くなり、穏やかならすぐOFFになる。出力160W/mは固定でも、実効出力（160W/m×ON比率）が天候に追従します。</p></li>\n<li><p><strong>路面温度は目標ではなく結果。</strong>熱源の温度を一定に保つことで路面への熱流が安定し、上限（最大66℃程度）を置くことで舗装も守ります。</p></li>\n</ol>\n<h2>4　締めの一言</h2>\n<p>「2つの温度で決めています。気温で<strong>やるかやらないか</strong>、ヒーター温度で<strong>いま流すか流さないか</strong>。出力は固定で、天候に合わせて自動で通電比率が変わる仕組みです。」</p>\n<h2>5　聞かれたらこう返す（即答3つ）</h2>\n<ol type=\"1\">\n<li><p><strong>晴れているのに動いている？</strong>　→\n正常です。気温が低いので、凍結予防と雪に備えた予熱をしています。</p></li>\n<li><p><strong>強い雪で積もったが？</strong>　→\n1時間3cmは融解だけで約280W/m²。物理的に一時的な積雪は避けられず、降り止んだ後の回復の早さが性能です。</p></li>\n<li><p><strong>電気代はどう決まる？</strong>　→ 8kW/本 × 運転時間 ×\nON比率。穏やかな日はON比率が下がり、実際の消費は時間に比例するより少なくなります。</p></li>\n</ol>\n<h2>6　覚える数字</h2>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>160W/m</strong></p>\n<p>出力（固定）／1本50m＝8kW</p></td>\n<td><p><strong>0〜6℃</strong></p>\n<p>気温設定：運転の許可</p></td>\n<td><p><strong>35〜60℃ ＋6</strong></p>\n<p>ヒーター温度設定：設定値ON／＋6℃OFF</p></td>\n<td><p><strong>80℃分</strong></p>\n<p>雪を融かす熱＝同量の水を80℃上げる熱</p></td>\n</tr>\n</tbody>\n</table>\n<p>※\n数値は一般的な物理量に基づく概算。設定値は現地条件で決定します。</p>\n"}, {"id": "キュービクル要約", "title": "キュービクル式高圧受電設備 要約", "cat": "power", "html": "<p><strong>キュービクル式高圧受電設備 要約</strong></p>\n<p>TAIYOSHEET計画推進部</p>\n<p>電気式ロードヒーティングをはじめとする大容量電気設備の導入検討では、受電方式の判断が計画初期の分岐点となる。本稿はその前提知識として、キュービクル式高圧受電設備の定義・構成・法令要求・維持管理を要約したものである。</p>\n<h1 id=\"定義と位置づけ\"><strong>1. 定義と位置づけ</strong></h1>\n<p>キュービクル（キュービクル式高圧受電設備）とは、高圧受電に必要な開閉器・遮断器・変圧器・保護継電器・計測機器等を、鋼板製の外箱に一括して収納した受変電設備である。JIS\nC 4620「キュービクル式高圧受電設備」に規格が定められている。</p>\n<p>電力会社から6.6kVの高圧で受電し、施設内で使用する電圧（三相200V／単相100V）に降圧して配電する役割を担う。現場で機器を個別に組み上げる開放形受電設備に比べ、工場製作による品質の安定、設置面積の縮小、感電・接触リスクの低減という利点がある。</p>\n<h2\nid=\"高圧受電が必要となる目安\"><strong>高圧受電が必要となる目安</strong></h2>\n<table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>受電方式</strong></th>\n<th><strong>契約電力の目安</strong></th>\n<th><strong>受電設備</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>低圧受電</td>\n<td>50kW未満</td>\n<td>不要（電力会社側の柱上変圧器で降圧）</td>\n</tr>\n<tr class=\"even\">\n<td>高圧受電</td>\n<td>50kW以上〜2,000kW未満</td>\n<td>キュービクル等の自家用受変電設備が必要</td>\n</tr>\n<tr class=\"odd\">\n<td>特別高圧受電</td>\n<td>2,000kW以上</td>\n<td>変電所相当の設備が必要</td>\n</tr>\n</tbody>\n</table>\n<p>契約電力が50kW以上となる場合、原則として高圧受電となり、需要家側にキュービクルの設置義務が生じる。この時点で設備は「自家用電気工作物」となり、後述の保安管理義務が発生する。</p>\n<h1 id=\"主要構成機器\"><strong>2. 主要構成機器</strong></h1>\n<table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>機器</strong></th>\n<th><strong>機能</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>区分開閉器（PAS／UGS）</td>\n<td>電力会社との責任分界点に設置。事故時に自施設を系統から切り離す</td>\n</tr>\n<tr class=\"even\">\n<td>断路器（DS）</td>\n<td>無負荷状態で回路を開放し、点検時の安全を確保する</td>\n</tr>\n<tr class=\"odd\">\n<td>避雷器（LA）</td>\n<td>雷サージ等の異常電圧を大地に放流し、機器を保護する</td>\n</tr>\n<tr class=\"even\">\n<td>計器用変成器（VCT）・電力量計</td>\n<td>電力会社の取引用計量を行う</td>\n</tr>\n<tr class=\"odd\">\n<td>主遮断装置（VCB／PF・LBS）</td>\n<td>過負荷・短絡等の事故電流を遮断する設備の中核機器</td>\n</tr>\n<tr class=\"even\">\n<td>保護継電器（OCR・地絡継電器等）</td>\n<td>異常を検出し、主遮断装置に遮断指令を出す</td>\n</tr>\n<tr class=\"odd\">\n<td>変圧器（Tr）</td>\n<td>6.6kVを200V／100Vに降圧する。動力用と電灯用を分けて設置</td>\n</tr>\n<tr class=\"even\">\n<td>進相コンデンサ（SC）</td>\n<td>力率を改善し、電力損失と電気料金基本料を抑制する</td>\n</tr>\n</tbody>\n</table>\n<h1 id=\"形式の区分\"><strong>3. 形式の区分</strong></h1>\n<h2 id=\"主遮断装置による区分\"><strong>主遮断装置による区分</strong></h2>\n<table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>形式</strong></th>\n<th><strong>主遮断装置</strong></th>\n<th><strong>特徴・適用</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>CB形</td>\n<td>高圧交流遮断器（VCB）</td>\n<td>受電設備容量4,000kVA以下に適用可。保護継電器との組合せで選択遮断が可能。大容量・重要施設向け</td>\n</tr>\n<tr class=\"even\">\n<td>PF・S形</td>\n<td>高圧限流ヒューズ＋高圧交流負荷開閉器（LBS）</td>\n<td>受電設備容量300kVA以下に適用。構成が簡素で小型・低コスト。小規模施設向け</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"設置環境による区分\"><strong>設置環境による区分</strong></h2>\n<ul>\n<li><p>屋外用：耐候性外箱。屋根・防水構造を備え、独立基礎上に据付ける。</p></li>\n<li><p>屋内用：電気室内設置を前提とし、外箱の防水要求が緩い。</p></li>\n<li><p>認定キュービクル：日本電気協会の認定を受けた製品。消防法上の離隔距離の緩和など、設置条件の面で有利となる。</p></li>\n</ul>\n<h1 id=\"設置に関する法令基準\"><strong>4.\n設置に関する法令・基準</strong></h1>\n<table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>区分</strong></th>\n<th><strong>主な要求事項</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>電気事業法</td>\n<td>自家用電気工作物として保安規程の届出、電気主任技術者の選任が必要。一定規模以上は工事計画の届出を要する</td>\n</tr>\n<tr class=\"even\">\n<td>電気設備技術基準</td>\n<td>接地工事、離隔距離、充電部の防護、地絡・過電流保護の具備</td>\n</tr>\n<tr class=\"odd\">\n<td>消防法・火災予防条例</td>\n<td>不燃材料による構造、建築物・隣接物からの距離確保（一般に3m以上。認定キュービクルは緩和規定あり）</td>\n</tr>\n<tr class=\"even\">\n<td>建築基準法</td>\n<td>規模・設置形態により工作物としての取扱いを確認。屋上設置時は荷重検討が必要</td>\n</tr>\n<tr class=\"odd\">\n<td>保有距離</td>\n<td>点検・操作に必要な離隔（一般に操作面1m以上、点検面0.6m以上、換気面0.2m以上）</td>\n</tr>\n</tbody>\n</table>\n<p>また、耐震固定（基礎への確実なアンカー固定）、浸水想定区域における基礎高さの検討、騒音・美観面からの設置位置調整も、実務上の必須検討項目である。</p>\n<h1 id=\"導入手続きの流れ\"><strong>5. 導入手続きの流れ</strong></h1>\n<ul>\n<li><p>負荷計算・契約電力の算定（同時使用率・将来増設分を織り込む）</p></li>\n<li><p>電力会社への事前協議、供給地点・引込ルートの決定</p></li>\n<li><p>設備仕様の決定（形式・容量・屋内外区分）と設置位置の調整</p></li>\n<li><p>保安規程の届出、電気主任技術者の選任または外部委託承認の取得</p></li>\n<li><p>製作・搬入・基礎工事・据付・結線</p></li>\n<li><p>竣工検査（絶縁耐力試験、保護継電器試験、接地抵抗測定）、電力会社立会いによる受電</p></li>\n</ul>\n<p>製作にはリードタイムを要し、変圧器や遮断器は調達状況により納期が長期化する場合がある。工程計画では発注時期を早期に確定させることが重要である。</p>\n<h1 id=\"維持管理と更新\"><strong>6. 維持管理と更新</strong></h1>\n<ul>\n<li><p>月次点検：無停電での外観・計測・絶縁監視。異常の早期把握を目的とする。</p></li>\n<li><p>年次点検：停電のうえ実施する精密点検。絶縁抵抗測定、保護継電器の動作試験、接続部の締付確認等。</p></li>\n<li><p>更新目安：高圧受電設備は概ね15〜20年（屋外設置はこれより短い）。変圧器・遮断器の経年劣化は事故に直結するため、計画的更新が前提となる。</p></li>\n<li><p>保安管理：電気主任技術者の選任が原則。一定規模以下（受電電圧7,000V以下・出力2,000kW未満）の設備は、電気保安法人等への外部委託が承認制度により認められる。<span class=\"edn\">（編注：原文「7,000kW未満」を訂正）</span></p></li>\n</ul>\n<h1 id=\"電気式ロードヒーティングへの適用上の留意点\"><strong>7.\n電気式ロードヒーティングへの適用上の留意点</strong></h1>\n<p>融雪負荷は、冬期に短期集中して大電力を消費する点に特徴があり、受電方式の判断に直接影響する。</p>\n<ul>\n<li><p>容量算定：TAIYOSHEET_RHは1ロール（50m）あたり8kWである。標準規模である100〜300m（2〜6ロール）では16〜48kWとなり低圧受電の範囲に収まるが、L区分の8〜12ロール（64〜96kW）では高圧受電、すなわちキュービクルの設置が前提となる。</p></li>\n<li><p>分界点の設計：規模がしきい値付近にある案件は、既設受電設備の余力確認を先行させ、キュービクル新設の要否を早期に切り分けることが望ましい。</p></li>\n<li><p>契約電力とデマンド：稼働が冬期に偏るため、契約電力の設定方法が運用コストを大きく左右する。降雪時のみの運転制御を前提とした負荷条件の整理が必要となる。</p></li>\n<li><p>工程への影響：キュービクル新設を伴う案件では、電力会社協議と設備製作が全体工程のクリティカルパスとなる。舗装工事の工程とは別軸で管理する必要がある。</p></li>\n<li><p>設置場所の確保：道路付帯施設では用地・保有距離・浸水条件の制約が厳しく、発注者との事前協議事項となる。</p></li>\n</ul>\n<p>以上</p>\n"}, {"id": "制御盤_ヒーター回路の絶縁抵抗", "title": "制御盤・ヒーター回路の絶縁抵抗", "cat": "ins", "html": "<p><strong>技術説明資料</strong></p>\n<p><strong>制御盤・ヒーター回路の絶縁抵抗</strong></p>\n<p>― 基準値・測定方法・傾向管理 ―</p>\n<p>株式会社太陽　TAIYOSHEET計画推進部　2026年9月4日</p>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>結論（これだけ覚える）</strong></p>\n<p><strong>絶縁抵抗は「事故が起きる前に見える唯一の兆候」。法定下限は三相200V回路で0.2MΩだが、実務では1MΩ以上を目安とし、竣工時の値を基準に「下がり方の傾向」で管理する。測定前にSSR・温度調節計・センサーは必ず切り離す。</strong></p></td>\n</tr>\n</tbody>\n</table>\n<h2>1　絶縁抵抗とは何を測っているのか</h2>\n<p>電線や機器の充電部と、大地（接地された盤の筐体・鉄骨など）との間の抵抗値です。絶縁が健全なら数十〜数百MΩ以上を示し、水分の侵入や損傷で絶縁が劣化すると値が下がります。放置すれば漏電・感電・漏電遮断器のトリップに至るため、</p>\n<p><strong>絶縁抵抗の低下は、事故が起きる「前」に数値として見える唯一の兆候</strong>です。道路ヒーティングでは、発熱体が切削溝の中——水の入る環境——に埋設されているため、この値の管理が設備の健全性管理そのものになります。</p>\n<h2>2　法令上の基準値（電気設備技術基準 第58条）</h2>\n<p>低圧電路の絶縁抵抗は、使用電圧の区分ごとに次の値以上でなければなりません。</p>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><strong>電路の使用電圧の区分</strong></td>\n<td><strong>絶縁抵抗の下限</strong></td>\n<td><strong>制御盤での該当回路</strong></td>\n</tr>\n<tr class=\"even\">\n<td>300V以下で対地電圧150V以下</td>\n<td>0.1MΩ</td>\n<td>制御回路（AC100V）、単相100V回路</td>\n</tr>\n<tr class=\"odd\">\n<td>300V以下で対地電圧150V超</td>\n<td>0.2MΩ</td>\n<td>三相200Vのヒーター主回路</td>\n</tr>\n<tr class=\"even\">\n<td>300V超</td>\n<td>0.4MΩ</td>\n<td>400V級回路（当社標準盤では通常なし）</td>\n</tr>\n</tbody>\n</table>\n<p>三相200V回路は対地電圧が150Vを超えるため、ヒーター回路の法定下限は<strong>0.2MΩ</strong>です。ただしこれは「これを切ったら違法」という最低線であり、実務ではこの値で良しとはしません（第5章）。なお、絶縁抵抗の測定が困難な場合は、使用電圧を加えたときの漏えい電流が1mA以下であることで代えられます（電技解釈第14条）。</p>\n<h2>3　測定方法</h2>\n<p><img\nsrc=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAA le>\n\n<tbody>\n<tr class=\"odd\">\n<td><strong>時期</strong></td>\n<td><strong>目的</strong></td>\n</tr>\n<tr class=\"even\">\n<td>竣工時</td>\n<td>基準値の取得。以後の傾向管理の起点</td>\n</tr>\n<tr class=\"odd\">\n<td>シーズン前（秋）</td>\n<td>1年で最も重要な測定。夏季の雨水侵入・充填材の劣化を運転前に把握する</td>\n</tr>\n<tr class=\"even\">\n<td>ELCBがトリップした後</td>\n<td>再投入前に必ず測定して原因回路を特定する。測らずに再投入するのは事故の再現行為</td>\n</tr>\n<tr class=\"odd\">\n<td>舗装工事・近接掘削の後</td>\n<td>ケーブルや発熱体を損傷していないかの確認</td>\n</tr>\n<tr class=\"even\">\n<td>シーズン後（春）</td>\n<td>冬期運転による変化の把握。次期の補修計画の材料</td>\n</tr>\n</tbody>\n</table>\n<h2>7　絶縁抵抗が低い場合の切り分け</h2>\n<p>回路ごとに測って値の低い回路を特定したら、盤内の端子台で盤側・ケーブル側・発熱体側を切り離し、区間ごとに測って低い区間を絞り込みます。</p>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><strong>区間</strong></td>\n<td><strong>疑わしい箇所</strong></td>\n</tr>\n<tr class=\"even\">\n<td>盤内</td>\n<td>結露による絶縁低下、端子の汚損・塵埃、電線被覆の損傷</td>\n</tr>\n<tr class=\"odd\">\n<td>給電ケーブル</td>\n<td>ハンドホール内の接続部の防水不良、埋設部の損傷、管口からの浸水</td>\n</tr>\n<tr class=\"even\">\n<td>発熱体</td>\n<td>充填材の破れ・剥離からの浸水、端末処理部（リード線接続部）、切削溝内の水</td>\n</tr>\n</tbody>\n</table>\n<p>切り分けの結果は記録し、補修後に再測定して回復を確認します。補修後の値が竣工時の基準値に戻らない場合は、別の浸水経路が残っている可能性があります。</p>\n<h2>8　常時監視という選択肢</h2>\n<p>年次の測定は停電が必要で、シーズン中の変化は捉えられません。重要路線や遠隔地では、制御盤に<strong>絶縁監視装置（Igr方式）</strong>を組み込む選択肢があります。運転中に対地漏れ電流の有効成分を常時監視し、設定値を超えると警報を出すため、停電せずに絶縁低下の進行を検知できます。導入時は初期費用と、警報値の設定（ELCB動作点より十分手前）を検討します。</p>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>説明の骨子（3点）</strong></p>\n<p><strong>①\n法定下限はヒーター回路で0.2MΩ。ELCBが動作する約7kΩとは30倍の差があり、トリップは絶縁が大きく崩れた後のサインである。</strong></p>\n<p><strong>②\n実務では1MΩ以上を目安とし、竣工時の基準値からの「下がり方」で管理する。竣工時の測定記録が全ての起点。</strong></p>\n<p><strong>③\n測定前にSSR・温度調節計・センサーを切り離す。ELCBトリップ後は測定してから再投入する。</strong></p></td>\n</tr>\n</tbody>\n</table>\n<p>※\n基準値は電気設備技術基準・同解釈に基づく一般的な値です。発熱体・充填材固有の絶縁基準（出荷時の値など）はメーカー仕様書を確認し、本資料の傾向管理に組み合わせてください。</p>\n"}, {"id": "グルービングと切削溝の角欠けについて", "title": "グルービングと切削溝の角欠けについて", "cat": "pave", "html": "<p><strong>技術説明資料</strong></p>\n<p><strong>グルービング工法と切削溝の角欠けについて</strong></p>\n<p>― TAIYOSHEET_RH\n切削（幅20mm×深さ65mm）における溝縁の角欠けが問題とならない理由 ―</p>\n<p>株式会社太陽　TAIYOSHEET計画推進部　2026年9月4日</p>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>この資料の目的</strong></p>\n<p>道路管理者・発注者との協議で、①アスファルト表層に溝を切って供用する工法（グルービング）が確立された技術であること、②TAIYOSHEET_RHの切削溝（幅20mm×深さ65mm）で切削上端に生じ得る微小な角欠けが、走行安全性・舗装の耐久性・供用性のいずれにも問題を生じない理由、および充填材上面を路面から3mm下げて仕上げる場合の考え方を、根拠を示して説明できるようにするものです。</p></td>\n</tr>\n</tbody>\n</table>\n<h1>第1部　グルービング工法とは</h1>\n<h2>1.1　目的と効果</h2>\n<p>グルービングは、舗装表面に細い溝を切り込む工法です。目的は路面の排水性とすべり抵抗の向上で、具体的には次の効果を狙います。</p>\n<ul>\n<li><p><strong>雨天時の排水</strong>：路面の水膜を溝から排出し、ハイドロプレーニング（水膜でタイヤが浮く現象）を防ぐ</p></li>\n<li><p><strong>すべり抵抗の向上</strong>：タイヤと路面の接触にエッジ効果を与え、制動距離を短くする</p></li>\n<li><p><strong>凍結時の効果</strong>：薄い氷膜を溝縁が破り、すべり抵抗を確保する</p></li>\n</ul>\n<h2>1.2　種類と一般的な寸法</h2>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><strong>種類</strong></td>\n<td><strong>溝の方向・主な目的</strong></td>\n<td><strong>主な適用箇所</strong></td>\n</tr>\n<tr class=\"even\">\n<td>縦溝（縦断方向）</td>\n<td>走行方向に平行。排水とハイドロプレーニング防止</td>\n<td>高速道路の本線、雨水が溜まりやすい区間</td>\n</tr>\n<tr class=\"odd\">\n<td>横溝（横断方向）</td>\n<td>走行方向に直角。制動時のすべり抵抗向上</td>\n<td>カーブ、急勾配、交差点手前、空港滑走路</td>\n</tr>\n</tbody>\n</table>\n<p>溝の寸法は用途で異なりますが、道路では<strong>幅6〜9mm・深さ6mm程度・間隔30〜60mm程度</strong>、空港滑走路では幅6mm・深さ6mm・間隔38mm程度が一般的な例として挙げられます。いずれも溝は開いたまま供用します。</p>\n<h2>1.3　施工方法</h2>\n<p>ダイヤモンドブレードを多数並べた専用機（グルービングマシン）で、既設舗装を湿式または乾式で切削します。舗装の打ち換えを伴わず、既設路面に後から施工できる点が特徴で、アスファルト舗装・コンクリート舗装の双方に適用されます。</p>\n<h2>1.4　留意点</h2>\n<ul>\n<li><p><strong>二輪車への影響</strong>：縦溝はハンドルが取られる感覚を与えることがあり、溝幅・間隔の選定と注意喚起が必要</p></li>\n<li><p><strong>騒音</strong>：横溝はタイヤ通過音が変わるため、沿道環境への配慮が必要</p></li>\n<li><p><strong>排水性舗装との組合せ</strong>：空隙の多い舗装には適さない</p></li>\n<li><p><strong>経年の溝縁摩耗</strong>：アスファルト舗装の開放溝では、溝縁が繰返し荷重で徐々に摩耗・欠けを生じ、効果が低下していく。これは開放溝の宿命であり、グルービングの維持管理上の課題として知られている</p></li>\n</ul>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><h1>第1部の結論</h1>\n<p><strong>アスファルト表層に溝を切って公道で供用することは、数十年の実績を持つ確立された技術です。</strong>ただし開放溝には「溝縁が自由端として荷重を受け続ける」という構造上の課題があります。TAIYOSHEET_RHの切削溝は、この課題を「溝を充填して閉じる」ことで構造的に回避しています（第2部）。</p></td>\n</tr>\n</tbody>\n</table>\n<h1>第2部　TAIYOSHEET_RH 切削溝の角欠けについて</h1>\n<h2>2.1　切削溝の構造</h2>\n<p>TAIYOSHEET_RHは、既設舗装に幅20mm×深さ65mmの溝を切削し、発熱体（9mm×48mm）を縦に挿入して、ポリブタジエン系の充填材で路面まで埋め戻す工法です。発熱体の上には17mmの充填材のかぶりがあり、完成後の路面は連続した面になります。</p>\n<p><img\nsrc=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAFvA+gDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAYHAgQFAwEI/8QAWxAAAQMDAgMCBQ0OBAQEBQIHAQACAwQFEQYSEyExB0EUIlFhlBUWFxgyU1RWcZGSk9EIIzU3QlVXc3WBsbLC0jZScqEkMzhidILB4iVDg6LhNGQmRWOVo7PT/8QAGwEBAQEBAQEBAQAAAAAAAAAAAAECAwQFBgf/xAA5EQEAAgECAwUFBgUEAwEAAAAAARECAxIEITFBUWGBwQUTcaHwIjJCkbHRBhQzNOFDRHKCUpLx0v/aAAwDAQACEQMRAD8A/SKIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIig+s+1nT2hb1Fa7tHXOqJYBUNMEG9u0uc3rnrlpSrE4RVP7Y3RXvN29F//ACtq29v2jbncYqNguULpN33yWmIY0BpcScEnADT3K7ZS4SaLX9om11NpdhcZ4adtQ6o3s4IycBmd2d3mAK4967adJ2G711urPVAzUEnCndHSOexrv9Q5L86x1tl8EgqYoKeonNxbNllCTM0+EFwxIBzDmEeKeeQMd6ldTqLT1RpzWtuu11lpLxfrg6dxZRSvihDHeI09/TOfJnzLe1nc/TLqqNlEao54QZxOnPGMrhWLW9rv+in6pp46qC2tZJJmojDXFrM7nAAkEcjjn3KmdWSzu7GbRc7nfZK2lut8ZO+SmEsLY4C17SxjXHcB4p5eVRyG20d3v94s+gLpVixutjXVZqXSOe2ISAyiNh6nAHLHPoOqm1bfpbTOo6PVmnaS9W9k7KWraXRidmx2ASOYye8LfrayG30M9ZUP2Q08bpZHYzhrRkn5gvzvc9L6TpLLo++aRrbk+O43aCDE1U47W5O5pZ0acgclIe3OjulEW1NDqu6xy3mRlDT2aF2IpSQGuPXoQefLqfOpXMtbWndRW3VNkhu9plfNRT54b3xOj3YODycAeoXUVJ1ekbb2V6UhpHXW/S1N+4dqM9PMwNpXOJdmNrsbRnPfnB7uqmukodT6TtN09eV6guVvofHpqtsbjM6MDLjJjrj9568+ikwsSkt91DadM24V95roqGlMjY+LJ03HoP8AY/Mta86utFjoKOqqZ3SMrjspRC3dx3bC5rWnoC4DlkjJwO9VBV0N37fr54RFJPZtI24nwWZ0eX1MvTeGk4/9AOXUlc69WS/0vazp3SMOtbpfXmRlbUtqg10dO1p3A7ckE7QTz6ZarSWviy6gob9pqmvlK9zaOoh4wMg2lg7w4dxBBB+Rah1xpgafF8N9ofUsycIVfFHD3/5c+Vb93LKfT9c7AYyOnkPIYAAaV+bZW 抑えられます。</p></li>\n<li><p><strong>熱による溝縁の劣化がない。</strong>ヒーター温度は設定値（35〜60℃）＋6℃で上限管理され、最大でも66℃程度です。これは夏季の路面温度と同等の範囲であり、アスファルトの軟化や充填材の劣化を進める温度ではありません。</p></li>\n<li><p><strong>公道での前例がある。</strong>交通量計測や信号制御に用いる車両感知器のループコイルは、アスファルト舗装に幅10mm前後・深さ40〜50mm程度の溝を切削し、ケーブルを収めて充填材で埋め戻す方法で、全国の公道に長年設置されています。コンクリート舗装の目地やクラックシールも同様に「切削溝＋充填」の構造です。切削溝を充填して供用する構造は、公道で広く実績のある確立された手法です。</p></li>\n</ol>\n<h2>2.4　舗装の管理基準との関係</h2>\n<p>舗装の供用性は、一般にひび割れ率・わだち掘れ量・平たん性（IRI）、および段差やポットホールといった局所損傷で評価されます。切削上端の数mm程度の角欠けは充填材で埋められた状態で供用されるため、段差を生じず、ひび割れ率・わだち掘れ・平たん性のいずれの評価項目にも該当しません。走行安全・乗り心地・構造耐久性のどの観点からも、管理上問題となる損傷には分類されない性質のものです。</p>\n<h2>2.5　施工品質管理による抑制</h2>\n<p>角欠けは構造上問題になりませんが、施工では次の管理で発生そのものを最小限に抑えます。</p>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><strong>管理項目</strong></td>\n<td><strong>内容</strong></td>\n</tr>\n<tr class=\"even\">\n<td>切削機械・ブレード</td>\n<td>ダイヤモンドブレードを使用し、摩耗したブレードは交換する。切れ味の低下は欠けの主因になる</td>\n</tr>\n<tr class=\"odd\">\n<td>切削速度・冷却</td>\n<td>適切な送り速度と湿式冷却で、ブレードの振れと過熱を防ぐ</td>\n</tr>\n<tr class=\"even\">\n<td>溝の清掃・乾燥</td>\n<td>切削粉と水分を除去し、充填材の付着を確実にする。付着不良は縁の支持を弱める</td>\n</tr>\n<tr class=\"odd\">\n<td>充填の仕上げ</td>\n<td>溝上端まで充填し、欠け部も同時に充填する。段差・凹みを残さない</td>\n</tr>\n<tr class=\"even\">\n<td>写真記録</td>\n<td>切削後・充填後の状態を撮影し、竣工図書に添付する</td>\n</tr>\n</tbody>\n</table>\n<h2>2.6　万一、大きな欠けが生じた場合</h2>\n<p>骨材の抜けなどで数cm規模の欠けが生じた場合も、その部分を清掃して充填材で埋め戻すことで路面の連続性は回復します。発熱体は溝底部（路面から17mm以上下）にあり、上端の欠けが発熱体に影響することはありません。補修は同一材料・同一手順で行え、特別な工法を要しません。</p>\n<h2>2.7　充填材の上面を路面から3mm下げて仕上げる場合</h2>\n<p>充填材の上面を路面と面一にせず、<strong>溝の中央部で路面から3mm低く（凹面状に）仕上げる</strong>施工とする場合があります。上端の縁が3mm露出するため「角欠けが起きやすくならないか」という質疑が想定されますが、この仕上げは<strong>充填材の剥離を防ぎ、結果として縁を長期にわたって守るための合理的な処置</strong>です。根拠を以下に示します。</p>\n<p><img\nsrc=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAD6A+gDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAwQHAgEI/8QAUxAAAQMDAgIEBgwMBQMCBgM で割ると<strong>上面は約1.2mm上昇</strong>します。3mmの下げがあれば、最大膨張時も路面より低い状態を維持できます（膨張係数は充填材メーカー値で確認）。</p></li>\n<li><p><strong>欠けが進んでも3mmで止まる（自己停止する幾何）。</strong>開放溝では欠けが深さ方向に際限なく進みます。3mm下げでは露出する縁の高さは最大3mmで、仮に縁が欠けても充填材の上面まで丸まった時点で自由端がなくなり、<strong>それ以上は進行しません</strong>。最悪でも3mmの面取りができた状態で安定します。</p></li>\n<li><p><strong>3mmは路面の凹凸として無視できる大きさ。</strong>密粒度舗装のきめ深さは1mm前後、排水性舗装では2mm前後、グルービングの開放深さは6mm、新設舗装の平たん性の許容は標準偏差2.4mm程度です。幅20mm×深さ3mmの凹みはこれらと同等以下で、タイヤは20mmを橋渡しし、3mmの凹みに沈み込むことはありません。</p></li>\n<li><p><strong>除雪機械との相性が良い。</strong>プラウやグレーダーのブレードは路面より出ているものを引っかけて損傷を与えます。面一や凸の充填材は引っかかる対象になりますが、3mm下げならブレードは両側の舗装面に乗って通過し、充填材にも縁にも当たりません。</p></li>\n</ol>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>留意点と回答（正直に伝える）</strong></p>\n<p>幅20mm・深さ3mmの凹みは縦断方向の溝になるため、勾配の緩い区間では薄い水膜が残り得ます。これに対しては次のように回答できます。</p>\n<p>① 冬期はヒーター運転で溝周辺が氷点を上回り、凍結しにくい。②\n仮に凍っても上面が開いているため氷は上方向に膨張し、縁を押し広げる力にならない。③\n3mmの水深は排水性舗装のきめ深さと同程度で供用上の問題にならない。④\n砂・細粒が自然に詰まり実質的に埋まる。</p>\n<p><strong>ただし下げを大きくし過ぎると開放溝の性格が強まるため、管理値を「中央部3mm・許容2〜4mm・壁面際は充填材を密着」と定めることを推奨します。</strong></p></td>\n</tr>\n</tbody>\n</table>\n<h1>第3部　説明のまとめ</h1>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>協議で使う説明の骨子</strong></p>\n<p><strong>①\nアスファルト表層に溝を切って供用する工法は、グルービングとして数十年の公道実績がある確立された技術です。</strong></p>\n<p><strong>②\n開放溝の課題は「溝縁が自由端として荷重を受け続ける」ことですが、TAIYOSHEETは溝を充填材で閉じるため、この課題が構造的に成立しません。</strong></p>\n<p><strong>③\n切削時の数mm程度の角欠けは、充填材で同時に埋まり、幅20mmはタイヤ接地幅の1/10程度で走行に影響せず、水も入らず、熱劣化もありません。ループコイル埋設など公道での同種構造の前例もあります。</strong></p>\n<p><strong>④\n舗装の管理基準（ひび割れ率・わだち掘れ・平たん性・段差）のいずれにも該当しない微小損傷であり、施工品質管理で発生自体も最小化します。</strong></p></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>想定質疑：3mm下げ仕上げについて</strong></p>\n<p><strong>Q．充填材を3mm下げると、縁が露出して欠けやすくならないか。</strong></p>\n<p>A．露出は最大3mmで、欠けても充填材上面まで丸まった時点で自由端がなくなり進行が止まります。面一にした場合の熱膨張による盛り上がりと充填材の剥離こそが縁を露出させる原因で、下げ仕上げはそれを防ぐための処置です。コンクリート目地の慣行とも一致します。</p>\n<p><strong>Q．凹みに水が溜まって凍らないか。</strong></p>\n<p>A．冬期はヒーター運転で氷点を上回ります。仮に凍っても上面が開いているため氷は上へ膨張し、縁を押す力になりません。3mmの水深はきめ深さと同程度です。</p>\n<p><strong>Q．どの程度まで下げてよいか。</strong></p>\n<p>A．熱膨張の吸収には約1.2mmで足り、3mmで十分な余裕があります。5mmを超えると開放溝の性格が強まるため、中央3mm・許容2〜4mmを管理値とします。</p></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>説得力を高めるために追記を推奨する自社データ（この欄を埋めてください）</strong></p>\n<p>・施工実績：累計施工延長、施工箇所数、管理者別の実績（国土交通省・NEXCO・首都高速道路\n等）</p>\n<p>・供用年数と追跡点検の結果：最長供用年数、点検時の溝縁の状態写真、補修の有無と内容</p>\n<p>・切削直後と充填後の状態写真（角欠けの実際の大きさが分かるスケール付き写真）</p>\n<p>・充填材の物性値：付着強度、伸び率、耐候性、使用温度範囲（メーカー試験成績書）</p>\n<p>　※\n本資料の論拠は工学的な原理と一般的な前例に基づいています。上記の実測データを添えることで、協議相手に対する説得力が大きく上がります。</p></td>\n</tr>\n</tbody>\n</table>\n"}, {"id": "アスファルトの種類_要約", "title": "アスファルトの種類・要約（1枚）", "cat": "pave", "html": "<p><strong>要約版</strong></p>\n<p><strong>アスファルトの種類</strong></p>\n<p>― 呼び方・使い分け・融雪への影響 ―　　株式会社太陽\nTAIYOSHEET計画推進部　2026年9月</p>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>まず押さえる2点</strong></p>\n<p><strong>① 呼び方は「粒度の種類\n＋（最大粒径）」。</strong>　例：密粒度アスファルト混合物(13) ＝\n骨材の最大粒径13mm。</p>\n<p><strong>②\n骨材の隙間（空隙）が多いか少ないかで性格が決まる。</strong>　隙間が少なければ緻密で水を通さず、多ければ水を通し音を吸う。</p></td>\n</tr>\n</tbody>\n</table>\n<h2>1　一覧表（この1枚で足りる）</h2>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><strong>種類</strong></td>\n<td><strong>空隙</strong></td>\n<td><strong>特徴と使いどころ</strong></td>\n</tr>\n<tr class=\"even\">\n<td>密粒度アスコン</td>\n<td>少ない</td>\n<td>最も標準的。粒度が連続的で隙間が少なく緻密。水を通さない。一般的な車道の表層・基層</td>\n</tr>\n<tr class=\"odd\">\n<td>粗粒度アスコン</td>\n<td>やや多い</td>\n<td>密粒度よりやや粗い粒度。主に基層用</td>\n</tr>\n<tr class=\"even\">\n<td>排水性（ポーラス）アスコン</td>\n<td>20%前後</td>\n<td>雨水を舗装内部に浸透させ路肩へ排水。水はね・夜間の反射・走行音を低減。高速道路や交通量の多い国道の表層で標準的。空隙が詰まると機能低下し定期清掃が必要</td>\n</tr>\n<tr class=\"odd\">\n<td>改質アスファルト（Ⅱ型・Ⅲ型等）</td>\n<td>―</td>\n<td>ポリマー添加で耐久性を高めたもの。わだち掘れ・剥離に強い。重交通路線・交差点・急勾配・橋面</td>\n</tr>\n<tr class=\"even\">\n<td>細粒度／細粒度ギャップ</td>\n<td>少ない</td>\n<td>細かい粒度。歩道や軽交通用</td>\n</tr>\n<tr class=\"odd\">\n<td>開粒度アスコン</td>\n<td>多い</td>\n<td>空隙が多く水を通す。すべり止め舗装など</td>\n</tr>\n<tr class=\"even\">\n<td>SMA（砕石マスチック）</td>\n<td>―</td>\n<td>粗骨材が噛み合う骨格にモルタルを充填。橋面舗装や重交通に使用</td>\n</tr>\n</tbody>\n</table>\n<h2>2　現場での見分け方</h2>\n<ol type=\"1\">\n<li><p><strong>表面がびっしり詰まって見える →\n密粒度。</strong>一般的な市道・県道の車道はほぼこれです。</p></li>\n<li><p><strong>表面が粗く、雨でも水たまりができず水はねが少ない →\n排水性。</strong>高速道路や交通量の多い国道の表層で多く見られます。</p></li>\n<li><p><strong>交差点・急勾配・橋の上 →\n改質アスファルトの可能性が高い。</strong>荷重や応力が集中する箇所です。</p></li>\n</ol>\n<h2>3　融雪設備にとって重要な違い</h2>\n<p>種類の違いは、TAIYOSHEETの計画で<strong>熱の伝わり方と切削・復旧の条件</strong>という2つの形で効いてきます。</p>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><strong>観点</strong></td>\n<td><strong>押さえるべき内容</strong></td>\n</tr>\n<tr class=\"even\">\n<td>熱の伝わり方</td>\n<td>排水性舗装は空隙が多く、密粒度より熱伝導率が低いため熱が横に広がりにくい。同じ出力でも融雪の挙動が変わり得る</td>\n</tr>\n<tr class=\"odd\">\n<td>切削・復旧</td>\n<td>舗装の種類と管理者の復旧基準で、認められる切削幅・復旧方法が変わる。幅20mmの切削で復旧可否は管理者判断</td>\n</tr>\n<tr class=\"even\">\n<td>確認のタイミング</td>\n<td>表層種別は現地調査・設計協議の段階で必ず確認する。後から判明すると設計と見積の前提が崩れる</td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>結論（説明用の一言）</strong></p>\n<p><strong>「舗装は隙間の少ない密粒度が標準で、交通量の多い国道では水を通す排水性が使われます。排水性は熱が横に広がりにくいので、融雪の計画では表層の種類を先に確認します。」</strong></p></td>\n</tr>\n</tbody>\n</table>\n<h2>4　覚える言葉</h2>\n<table>\n\n<tbody>\n<tr class=\"odd\">\n<td><strong>密粒度</strong> 標準・緻密</td>\n<td><strong>排水性</strong> 空隙20%</td>\n<td><strong>改質</strong> 重交通・橋面</td>\n<td><strong>(13)</strong> 最大粒径13mm</td>\n</tr>\n</tbody>\n</table>\n<p>※\n適用区分・配合・復旧方法は舗装設計施工指針および管理者の基準書で決まります。実務では最新の基準と管理者協議で確認してください。</p>\n"}];

const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const norm=s=>String(s).normalize("NFKC").toLowerCase().replace(/[\u3041-\u3096]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+0x60)).replace(/\s+/g," ");
const words=t=>norm(t).split(" ").filter(Boolean);
function expand(w){const out=[w];SYN.forEach(g=>{if(g.some(x=>norm(x)===w||norm(x).includes(w)||w.includes(norm(x))))g.forEach(x=>out.push(norm(x)));});return [...new Set(out)];}
function hit(hay,ws){const h=norm(hay);return ws.every(w=>expand(w).some(x=>h.includes(x)));}
function hl(s){if(!term)return esc(s);let out=esc(s);words(term).forEach(w=>expand(w).forEach(x=>{try{out=out.replace(new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),m=>"\u0001"+m+"\u0002");}catch(e){}}));return out.replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>");}
function score(it,ws){let s=0;const q=norm(it.q),t=norm(it.t);ws.forEach(w=>expand(w).forEach(x=>{if(q.includes(x))s+=5;if(t.includes(x))s+=3;if(norm(it.a).includes(x))s+=1;}));return s+(it.s?1:0);}

function docSections(d){const tmp=document.createElement("div");tmp.innerHTML=d.html;const out=[];let cur={h:d.title,parts:[]};[...tmp.children].forEach(n=>{if(/^H[1-3]$/.test(n.tagName)){if(cur.parts.length)out.push(cur);cur={h:n.textContent.trim(),parts:[]};}else{const tx=n.textContent.replace(/\s+/g," ").trim();if(tx)cur.parts.push(tx);}});if(cur.parts.length)out.push(cur);return out;}

function importProj(o){const used=new Set();const nk=s=>String(s).normalize("NFKC").toLowerCase().replace(/[\s_\-]/g,"");Object.entries(IMPORT_KEYS).forEach(([field,aliases])=>{const al=aliases.map(nk);for(const k of Object.keys(o)){if(al.includes(nk(k))&&o[k]!==undefined&&o[k]!==null&&o[k]!==""){let v=String(o[k]);if(field==="lanes")v=/2|両|4/.test(v)?"2":"1";PROJ[field]=v;used.add(k);break;}}});const extra=Object.keys(o).filter(k=>!used.has(k)&&typeof o[k]!=="object").map(k=>k+"："+o[k]);if(extra.length)PROJ.note=(PROJ.note?PROJ.note+"\n":"")+"【読み込み備考】"+extra.join("／");}
function prepDone(grp,i,it){if(it.field)return !!PROJ[it.field];if(it.calc)return !!(parseFloat(PROJ.len)>0);return !!PREP_STATE[grp+"#"+i];}
